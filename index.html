  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/unbounded@5.2.5/index.css">
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --surface-3: #eaecf0;
      --text: #101828;
      --text-2: #344054;
      --muted: #667085;
      --faint: #98a2b3;
      --border: #e7e9ee;
      --border-strong: #d0d5dd;
      --navy: #132f52;
      --blue: #2463d9;
      --blue-soft: #eaf1fd;
      --orange: #ef7a12;
      --orange-soft: #fff2e5;
      --purple: #7a5af0;
      --purple-soft: #f1edfe;
      --green: #12a150;
      --green-soft: #e6f6ed;
      --red: #e5484d;
      --red-soft: #fdecec;
      --amber: #c98200;
      --amber-soft: #fff5dc;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px -16px rgba(16, 24, 40, .16);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, "D2Coding", ui-monospace, monospace;
    }
    :root { color-scheme: light; }
    /* 눈의 피로를 줄이는 다크 테마 (기본값) */
    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b0e13;
        --surface: #12171f;
        --surface-2: #19202a;
        --surface-3: #222a36;
        --text: #f2f4f7;
        --text-2: #d0d5dd;
        --muted: #98a2b3;
        --faint: #667085;
        --border: #222a35;
        --border-strong: #344054;
        --navy: #0e2340;
        --blue: #5b8ff5;
        --blue-soft: rgba(91, 143, 245, .14);
        --orange: #ff9a3d;
        --orange-soft: rgba(255, 154, 61, .14);
        --purple: #9d84ff;
        --purple-soft: rgba(157, 132, 255, .15);
        --green: #3ccf7e;
        --green-soft: rgba(60, 207, 126, .13);
        --red: #ff6b6f;
        --red-soft: rgba(255, 107, 111, .13);
        --amber: #f5b13d;
        --amber-soft: rgba(245, 177, 61, .14);
        --shadow: none;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
      font-size: 15px; line-height: 1.6; letter-spacing: -0.006em; -webkit-font-smoothing: antialiased;
      font-feature-settings: "ss06", "tnum";
    }
    button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
    button { cursor: pointer; }
    a { color: var(--blue); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
    ::selection { background: color-mix(in srgb, var(--orange) 30%, transparent); }
    .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ic.sm { width: 15px; height: 15px; }
    .ic.lg { width: 22px; height: 22px; }

    /* ============ Layout ============ */
    .app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
    .side {
      position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--border);
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px 14px; text-decoration: none; color: inherit; }
    .logo {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0;
      background: linear-gradient(135deg, var(--navy), var(--blue)); color: #fff; font-weight: 800; font-size: .9rem; letter-spacing: -.02em;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .brand b { display: block; font-size: .98rem; letter-spacing: -.02em; }
    .brand small { display: block; font-size: .74rem; color: var(--muted); }
    .side-search {
      margin: 4px 14px 8px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-size: .87rem; text-align: left;
    }
    .side-search:hover { border-color: var(--border-strong); }
    .side-search kbd { margin-left: auto; font-family: var(--font); font-size: .7rem; border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 5px; color: var(--faint); }
    .nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; scrollbar-width: thin; }
    .nav-label { font-size: .7rem; font-weight: 700; color: var(--faint); margin: 16px 10px 6px; letter-spacing: .06em; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; color: var(--text-2);
      text-decoration: none; font-size: .92rem; font-weight: 550; transition: background .12s;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active { background: var(--blue-soft); color: var(--blue); font-weight: 650; }
    .nav-item .count { margin-left: auto; font-size: .74rem; color: var(--faint); font-weight: 500; }
    .nav-days { margin: 2px 0 4px 18px; padding-left: 10px; border-left: 1px solid var(--border); }
    .nav-day { padding: 5px 10px; font-size: .86rem; font-weight: 500; }
    .nav-day .pdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .nav-day.is-today .count { color: var(--orange); font-weight: 700; }
    .nav-day.is-done .count { color: var(--green); font-weight: 700; }
    .pdot.learn { background: var(--blue); } .pdot.project { background: var(--orange); } .pdot.eval { background: var(--purple); }
    .side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--border); }
    .sync-pill { border-radius: 12px; padding: 10px 12px; background: var(--surface-2); font-size: .8rem; }
    .sync-pill .sp-head { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--text); }
    .sync-pill .sp-sub { color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sync-pill .btn { margin-top: 8px; width: 100%; justify-content: center; }
    .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
    .sdot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .sdot.busy { background: var(--blue); animation: pulse 1s infinite; }
    .sdot.warn { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
    .sdot.err { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
    .local-state { font-size: .72rem; color: var(--faint); margin-top: 8px; padding-left: 2px; }
    @keyframes pulse { 50% { opacity: .35; } }

    .topbar { display: none; }
    .main { padding: 32px 40px 72px; min-width: 0; }
    .page { max-width: 1180px; margin: 0 auto; }

    /* ============ Primitives ============ */
    .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .crumb { font-size: .82rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    h1 { font-size: clamp(1.55rem, 2.6vw, 2rem); line-height: 1.25; letter-spacing: -.03em; margin: 0; font-weight: 750; }
    h2 { letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .small { font-size: .84rem; }
    .xs { font-size: .76rem; }
    .num { font-variant-numeric: tabular-nums; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
    .card + .card { margin-top: 16px; }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 28px; }
    .card-head h2 { font-size: 1rem; font-weight: 700; margin: 0; }
    .card-head .ic { color: var(--muted); }
    .card-head .spacer + * { flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px;
      border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: .87rem; font-weight: 650; text-decoration: none; white-space: nowrap; transition: border-color .12s, background .12s, transform .05s;
    }
    .btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: color-mix(in srgb, var(--blue) 88%, #000); }
    .btn.dark { background: var(--text); border-color: var(--text); color: var(--bg); }
    .btn.accent { background: var(--orange); border-color: var(--orange); color: #fff; }
    .btn.accent:hover { background: color-mix(in srgb, var(--orange) 88%, #000); }
    .btn.ghost { background: transparent; border-color: transparent; }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { border-color: var(--red); background: var(--red-soft); }
    .btn.sm { height: 30px; padding: 0 10px; font-size: .8rem; border-radius: 8px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border: none; background: none; border-radius: 8px; color: var(--faint); }
    .icon-btn:hover { color: var(--red); background: var(--red-soft); }
    .input, .textarea, .select {
      width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: .93rem;
      transition: border-color .12s, box-shadow .12s;
    }
    .input::placeholder, .textarea::placeholder { color: var(--faint); }
    .textarea { resize: vertical; min-height: 90px; line-height: 1.65; }
    .input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 14%, transparent); }
    .select { width: auto; padding-right: 30px; }
    .field { margin-bottom: 14px; }
    .field > label, .flabel { display: block; font-size: .8rem; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
    .field-msg { color: var(--red); font-size: .78rem; margin-top: 4px; }
    .field-msg:empty { display: none; }
    .check { display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .check input { width: 17px; height: 17px; accent-color: var(--green); flex-shrink: 0; margin: 0; }
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .chip.today { background: var(--orange-soft); color: var(--orange); }
    .chip.late { background: var(--red-soft); color: var(--red); }
    .chip.done { background: var(--green-soft); color: var(--green); }
    .chip.learn { background: var(--blue-soft); color: var(--blue); }
    .chip.project { background: var(--orange-soft); color: var(--orange); }
    .chip.eval { background: var(--purple-soft); color: var(--purple); }
    .bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--blue); transition: width .35s ease; }
    .bar.project > i { background: var(--orange); } .bar.eval > i { background: var(--purple); } .bar.green > i { background: var(--green); }
    .banner {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
      background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent); font-size: .9rem;
    }
    .banner .ic { color: var(--amber); }
    .banner.err { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
    .banner.err .ic { color: var(--red); }
    .banner .spacer { min-width: 200px; }
    .empty { color: var(--muted); font-size: .9rem; padding: 18px; text-align: center; border: 1px dashed var(--border-strong); border-radius: 12px; list-style: none; }
    .tabs { display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface-3); overflow-x: auto; max-width: 100%; }
    .tab { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 7px 14px; border-radius: 9px; font-size: .87rem; font-weight: 650; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
    .tab .count { font-size: .74rem; color: var(--faint); font-weight: 600; }

    /* ============ Dashboard ============ */
    .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
    .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
    .bento > .card + .card { margin-top: 0; }
    .hero {
      position: relative; overflow: hidden; border-radius: 22px; padding: 28px 30px; color: #fff; min-height: 236px;
      background: linear-gradient(130deg, #0f2747 0%, #17406f 48%, #2463d9 100%);
      display: flex; gap: 24px; align-items: center;
    }
    .hero::before {
      content: ""; position: absolute; width: 360px; height: 360px; right: -80px; top: -140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 122, 18, .55), transparent 65%); filter: blur(8px);
    }
    .hero::after {
      content: ""; position: absolute; inset: 0; opacity: .14; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.7) 1px, transparent 1px); background-size: 18px 18px;
      mask-image: linear-gradient(90deg, transparent 30%, #000);
    }
    .hero > * { position: relative; z-index: 1; }
    .hero-body { flex: 1; min-width: 0; }
    .hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 650; color: #ffd2a8; }
    .hero h1 { font-size: clamp(1.45rem, 2.4vw, 1.9rem); margin: 8px 0 4px; }
    .hero .lead { color: #c8d6ea; margin: 0; font-size: .95rem; }
    .hero-now { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .now-box { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 14px; backdrop-filter: blur(6px); }
    .now-box .l { font-size: .74rem; color: #ffd2a8; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .now-box .t { font-weight: 700; font-size: .98rem; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5f; animation: pulse 1.2s infinite; }
    .hero .btn.accent { height: 40px; padding: 0 16px; }
    .hero .btn.glass { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.22); height: 40px; }
    .hero .btn.glass:hover { background: rgba(255,255,255,.2); }
    .ring { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .ring-bg { stroke: rgba(255,255,255,.16); }
    .ring .ring-fg { stroke: #ffb066; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
    .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-label strong { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .ring-label span { font-size: .72rem; color: #c8d6ea; margin-top: 4px; }
    .ring-dday { font-size: .78rem; text-align: center; color: #c8d6ea; margin-top: 6px; }
    .kpi { display: flex; flex-direction: column; gap: 4px; }
    .kpi .k-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; }
    .kpi .k-ic.blue { background: var(--blue-soft); color: var(--blue); }
    .kpi .k-ic.orange { background: var(--orange-soft); color: var(--orange); }
    .kpi .k-ic.purple { background: var(--purple-soft); color: var(--purple); }
    .kpi .k-ic.green { background: var(--green-soft); color: var(--green); }
    .kpi .k-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
    .kpi .k-value { font-size: 1.75rem; font-weight: 780; letter-spacing: -.03em; line-height: 1.2; }
    .kpi .k-value small { font-size: .95rem; color: var(--faint); font-weight: 600; }
    .kpi .k-sub { font-size: .8rem; color: var(--muted); }
    .kpi .bar { margin-top: 8px; }

    .sync-slot { display: flex; }
    .sync-slot > .sync-card { flex: 1; display: flex; flex-direction: column; }
    .sync-slot .sc-actions { margin-top: auto; padding-top: 14px; }
    .sync-card .sc-top { display: flex; align-items: flex-start; gap: 12px; }
    .sync-card .sc-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); color: var(--muted); }
    .sync-card.ok .sc-ic { background: var(--green-soft); color: var(--green); }
    .sync-card.warn .sc-ic { background: var(--amber-soft); color: var(--amber); }
    .sync-card.err .sc-ic { background: var(--red-soft); color: var(--red); }
    .sync-card.off .sc-ic { background: var(--orange-soft); color: var(--orange); }
    .sync-card h3 { margin: 0; font-size: 1rem; letter-spacing: -.02em; }
    .sync-card p { margin: 4px 0 0; color: var(--muted); font-size: .86rem; }
    .sync-card .sc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .sync-card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: .84rem; }
    .sync-card dt { color: var(--muted); }
    .sync-card dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

    .journey-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px 4px; scrollbar-width: thin; }
    .journey { display: grid; grid-template-columns: repeat(8, minmax(108px, 1fr)); column-gap: 10px; min-width: 920px; }
    .jstep .jst { font-size: .7rem; font-weight: 700; color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }
    .jstep .jst.late { color: var(--red); } .jstep .jst.today { color: var(--orange); } .jstep .jst.done { color: var(--green); }
    .jphase { font-size: .74rem; font-weight: 700; padding: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    .jphase::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .25; }
    .jphase.learn { grid-column: 1 / 6; color: var(--blue); }
    .jphase.project { grid-column: 6 / 8; color: var(--orange); }
    .jphase.eval { grid-column: 8 / 9; color: var(--purple); }
    .jstep {
      position: relative; display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: inherit;

    .sc { display: flex; align-items: center; min-width: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); transition: border-color .12s, background .12s; }
    .sc:hover { border-color: var(--blue); background: var(--blue-soft); }
    .sc-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 2px 6px 7px; color: var(--text); text-decoration: none; font-size: .84rem; font-weight: 600; }
    .sc-av { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .72rem; flex-shrink: 0; }
    .sc-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sc kbd { font-family: var(--font); font-size: .64rem; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 1.5; }
    .sc .icon-btn { width: 24px; height: 24px; margin-right: 3px; flex-shrink: 0; opacity: 0; }
    .sc:hover .icon-btn, .sc .icon-btn:focus-visible { opacity: 1; }
    @media (hover: none) { .sc .icon-btn { opacity: .7; } }
    .sc-form { display: flex; gap: 6px; margin-bottom: 8px; }
    .sc-form .input { min-width: 0; padding: 6px 8px; font-size: .84rem; }
    .gtile.done::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-size: .75rem; display: grid; place-items: center; font-weight: 800; }

    /* ============ Day ============ */
    .dhead { position: relative; overflow: hidden; border-radius: 22px; padding: 26px 28px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .dhead::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--blue); }
    .dhead.project::before { background: var(--orange); } .dhead.eval::before { background: var(--purple); }
    .dhead .dno { font-size: .9rem; font-weight: 800; letter-spacing: .02em; color: var(--blue); }
    .dhead.project .dno { color: var(--orange); } .dhead.eval .dno { color: var(--purple); }
    .dhead h1 { margin: 6px 0 10px; }
    .dmeta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; }
    .dmeta span { display: inline-flex; align-items: center; gap: 6px; }
    .dprog { display: flex; align-items: center; gap: 12px; margin-top: 18px; max-width: 460px; font-size: .84rem; font-weight: 650; }
    .dprog .bar { flex: 1; height: 8px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .tasks { list-style: none; padding: 0; margin: 0 0 12px; }
    .task { display: flex; align-items: flex-start; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
    .task:last-child { border-bottom: none; }
    .task input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--blue); flex-shrink: 0; }
    .task label { flex: 1; cursor: pointer; overflow-wrap: anywhere; font-size: .93rem; }
    .task.checked label { text-decoration: line-through; color: var(--faint); }
    .task .icon-btn { opacity: 0; }
    .task:hover .icon-btn, .task .icon-btn:focus-visible { opacity: 1; }
    @media (hover: none) { .task .icon-btn { opacity: .7; } }
    .tag-mini { font-size: .68rem; color: var(--orange); font-weight: 700; margin-left: 6px; background: var(--orange-soft); padding: 1px 6px; border-radius: 5px; }
    .inline-form { display: flex; gap: 6px; }
    .inline-form .input { min-width: 0; }
    .note-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .note-input { min-height: 460px; font-family: var(--mono); font-size: .88rem; line-height: 1.75; background: var(--surface-2); border-color: transparent; }
    .note-input:focus { background: var(--surface); }
    .kpt { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .kpt .field { margin: 0; }
    .kpt .textarea { min-height: 120px; }
    .kpt label i { font-style: normal; display: inline-block; width: 20px; height: 20px; border-radius: 6px; text-align: center; line-height: 20px; font-size: .72rem; font-weight: 800; margin-right: 6px; }
    .k-k { background: var(--green-soft); color: var(--green); } .k-p { background: var(--red-soft); color: var(--red); } .k-t { background: var(--blue-soft); color: var(--blue); }

    .md { overflow-wrap: anywhere; line-height: 1.75; }
    .md h2, .md h3, .md h4 { margin: 1.2em 0 .45em; line-height: 1.35; }
    .md h2 { font-size: 1.2rem; } .md h3 { font-size: 1.05rem; } .md h4 { font-size: .96rem; }
    .md > :first-child { margin-top: 0; }
    .md p { margin: .5em 0; }
    .md ul, .md ol { padding-left: 1.4em; margin: .4em 0; }
    .md li.todo { list-style: none; margin-left: -1.2em; }
    .md code { background: var(--surface-3); padding: 1px 6px; border-radius: 6px; font-size: .86em; font-family: var(--mono); }
    .md pre { background: #0d1520; color: #e4ebf3; padding: 14px 16px; border-radius: 12px; overflow-x: auto; font-size: .85rem; }
    .md pre code { background: none; padding: 0; color: inherit; }
    .md blockquote { margin: .6em 0; padding: 6px 14px; border-left: 3px solid var(--orange); background: var(--orange-soft); border-radius: 0 8px 8px 0; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .md a { text-underline-offset: 3px; }
    .preview { min-height: 460px; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }

    .drop {
      display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 14px 16px; cursor: pointer;
      transition: border-color .15s, background .15s; font-size: .88rem; color: var(--muted);
    }
    .drop .ic { color: var(--blue); }
    .drop strong { color: var(--text); display: block; }
    .drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-soft); }
    .files { list-style: none; padding: 0; margin: 12px 0 0; }
    .file { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .file:last-child { border-bottom: none; }
    .file-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; background: var(--surface-2); display: grid; place-items: center;
      font-size: .64rem; font-weight: 800; color: var(--muted); overflow: hidden; text-transform: uppercase; letter-spacing: .02em;
    }
    .file-icon img { width: 100%; height: 100%; object-fit: cover; }
    .file-icon.pdf { background: var(--red-soft); color: var(--red); }
    .file-icon.doc { background: var(--blue-soft); color: var(--blue); }
    .file-icon.link { background: var(--orange-soft); color: var(--orange); }
    .file-meta { flex: 1; min-width: 0; }
    .file-name { border: none; background: none; padding: 0; font-weight: 650; font-size: .9rem; text-align: left; overflow-wrap: anywhere; color: var(--text); text-decoration: none; }
    .file-name:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
    .file-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
    .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
    .shots:empty { display: none; }
    .shot { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
    .shot img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
    .shot .icon-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.55); color: #fff; width: 24px; height: 24px; }

    /* ============ Archive ============ */
    .arch { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
    .toc { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
    .toc a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--text-2); font-size: .87rem; font-weight: 550; }
    .toc a:hover { background: var(--surface); }
    .toc a .count { margin-left: auto; font-size: .74rem; color: var(--faint); }
    .toc .t-label { font-size: .7rem; font-weight: 700; color: var(--faint); letter-spacing: .06em; margin: 6px 10px; }
    .aday { scroll-margin-top: 20px; }
    .aday-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .aday-head h2 { margin: 0; font-size: 1.12rem; }
    .aday-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
    .sec-label { font-size: .74rem; font-weight: 700; color: var(--faint); letter-spacing: .05em; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .clamp { position: relative; max-height: 260px; overflow: hidden; }
    .clamp.open { max-height: none; }
    .clamp:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--surface)); }
    .mini-deliv { border-radius: 12px; background: var(--surface-2); padding: 12px 14px; }
    .mini-deliv img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; cursor: zoom-in; }
    .mini-deliv b { display: block; font-size: .92rem; }
    .mini-deliv p { margin: 4px 0 0; font-size: .84rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .kpt-row { display: grid; gap: 6px; margin-top: 14px; }
    .kpt-row div { display: flex; gap: 8px; font-size: .86rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .kpt-row i { font-style: normal; flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; text-align: center; line-height: 20px; font-size: .7rem; font-weight: 800; }
    .compact-list { list-style: none; padding: 0; margin: 0; }
    .compact-list li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .86rem; min-width: 0; }
    .compact-list li > :last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compact-list .ic { color: var(--faint); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .filters .search-in { flex: 1; min-width: 200px; }
    .gal-big { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .gcard .gimg { aspect-ratio: 16 / 10; background: var(--surface-2); position: relative; }
    .gcard .gimg img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .gcard .gbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .gcard h3 { margin: 0; font-size: 1rem; }
    .gcard p { margin: 0; font-size: .86rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .result { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .result:last-child { border-bottom: none; }
    .result .file-name, .result a { font-weight: 650; }
    .result p { margin: 4px 0 0; font-size: .87rem; color: var(--muted); overflow-wrap: anywhere; }
    mark { background: color-mix(in srgb, var(--orange) 32%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

    /* ============ Portfolio / Backup ============ */
    .pf-cols { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
    .pf-preview { position: sticky; top: 20px; }
    .pf-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border); border-bottom: none; border-radius: 16px 16px 0 0; background: var(--surface-2); font-size: .8rem; color: var(--muted); }
    .pf-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
    .pf-frame { display: block; width: 100%; height: 76vh; min-height: 520px; border: 1px solid var(--border); border-radius: 0 0 16px 16px; background: #fff; }
    .img-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .img-pick .thumb { width: 64px; height: 64px; border-radius: 14px; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; color: var(--faint); flex-shrink: 0; }
    .img-pick .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .steps { list-style: none; counter-reset: s; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
    .steps li { counter-increment: s; display: flex; gap: 10px; font-size: .88rem; color: var(--text-2); }
    .steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-size: .74rem; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: .88rem; margin: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

    /* ============ AI Studio ============ */
    .ai-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
    .ai-layout > .card:first-child { position: sticky; top: 20px; padding: 14px; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; }
    .skill-cat { font-size: .7rem; font-weight: 700; color: var(--faint); letter-spacing: .06em; margin: 14px 6px 6px; }
    .skill-cat:first-child { margin-top: 2px; }
    .skill { display: flex; gap: 10px; align-items: flex-start; border: 1px solid transparent; border-radius: 12px; padding: 8px 10px; color: var(--text); text-decoration: none; transition: background .12s; }
    .skill:hover { background: var(--surface-2); }
    .skill.active { background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 28%, transparent); }
    .s-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); color: var(--muted); }
    .skill.active .s-ic { background: var(--blue); color: #fff; }
    .skill b { display: block; font-size: .88rem; font-weight: 650; }
    .skill span > span { display: block; font-size: .75rem; color: var(--muted); line-height: 1.45; }
    .s-ic-lg { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; color: #fff; background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .provider-switch { display: inline-flex; gap: 2px; padding: 4px; background: var(--surface-3); border-radius: 12px; }
    .provider-switch button { border: none; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 650; font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
    .provider-switch button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
    .mono { font-family: var(--mono); font-size: .85rem; line-height: 1.6; }
    .ai-out { min-height: 200px; border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--surface); }
    .ai-out.empty-out { display: grid; place-items: center; color: var(--faint); text-align: center; background: var(--surface-2); border-style: dashed; }
    .ai-out .cursor { display: inline-block; width: 8px; height: 1.05em; background: var(--blue); vertical-align: text-bottom; margin-left: 2px; animation: pulse .9s infinite; }
    .ai-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .78rem; color: var(--muted); margin-top: 10px; }
    .ctx-box { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .8rem; color: var(--muted); max-height: 200px; overflow: auto; white-space: pre-wrap; font-family: var(--mono); }
    .img-attach { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .img-attach img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
    .err-box { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 14px; font-size: .87rem; margin-bottom: 12px; font-weight: 600; }
    .ai-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .ai-quick a { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: .86rem; font-weight: 600; transition: border-color .12s, background .12s; }
    .ai-quick a:hover { border-color: var(--blue); background: var(--blue-soft); }
    .ai-quick .ic { color: var(--blue); }
    .feed .f-ic.ai { background: linear-gradient(135deg, var(--blue), var(--purple)); color: #fff; }

    /* ============ Sites ============ */
    .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .site { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; min-width: 0; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .site:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
    .site .av { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; color: #fff; flex-shrink: 0; font-size: .95rem; }
    .site .s-body { flex: 1; min-width: 0; }
    .site .s-title { font-weight: 700; color: var(--text); text-decoration: none; font-size: .93rem; overflow-wrap: anywhere; }
    .site a.s-title:hover { color: var(--blue); }
    .site .host { font-size: .74rem; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site p { margin: 6px 0 0; font-size: .82rem; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
    .site .s-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .site .s-act { display: flex; flex-direction: column; gap: 2px; margin: -4px -6px 0 0; }
    .icon-btn.star:hover { color: var(--orange); background: var(--orange-soft); }
    .icon-btn.star.on { color: var(--orange); }
    .icon-btn.star.on .ic { fill: currentColor; }
    .icon-btn.plain:hover { color: var(--blue); background: var(--blue-soft); }
    .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: .8rem; font-weight: 650; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
    .chip-btn:hover { border-color: var(--border-strong); }
    .chip-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .chip-btn .count { font-weight: 500; opacity: .7; }
    .site-sec { font-size: 1rem; font-weight: 750; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; letter-spacing: -.02em; }
    .site-sec i { width: 10px; height: 10px; border-radius: 3px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
    .form-grid .full { grid-column: 1 / -1; }

    /* ============ Settings ============ */
    .status-line { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 650; margin-bottom: 14px; flex-wrap: wrap; }
    .code-block { background: #0d1520; color: #e4ebf3; border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: .8rem; line-height: 1.7; overflow-x: auto; white-space: pre; margin: 12px 0 0; }
    .mode-card { display: flex; gap: 14px; align-items: center; }
    .mode-card .sc-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; }
    .file-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .file-chips code { font-family: var(--mono); font-size: .76rem; background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
    @media (max-width: 1180px) {
      .ai-layout { grid-template-columns: minmax(0, 1fr); }
      .ai-layout > .card:first-child { position: static; max-height: none; }
      .skill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 6px; }
      .skill-cat { grid-column: 1 / -1; }
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: minmax(0, 1fr); }
      .ai-quick { grid-template-columns: minmax(0, 1fr); }
      .ai-layout > .card:first-child { padding: 8px; }
      .skill-list { display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; }
      .skill-cat, .skill span > span { display: none; }
      .skill { flex-shrink: 0; align-items: center; border-color: var(--border); padding: 6px 10px 6px 6px; }
      .skill .s-ic { width: 26px; height: 26px; }
      .skill b { white-space: nowrap; font-size: .84rem; }
    }

    /* ============ App bar (현재 시간 · 실습 타이머 · 자동 저장) ============ */
    .appbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 28px; min-height: 62px;
      background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    }
    .appbar .menu-btn { display: none; width: 36px; height: 36px; color: var(--text); border: 1px solid var(--border); }
    .appbar .menu-btn:hover { background: var(--surface-2); color: var(--text); }
    .clock { display: flex; flex-direction: column; line-height: 1.15; min-width: 96px; }
    .clock b { font-size: 1.08rem; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .clock span { font-size: .72rem; color: var(--muted); }
    .timer { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .timer.running { border-color: color-mix(in srgb, var(--green) 55%, transparent); box-shadow: 0 0 0 3px var(--green-soft); }
    .timer .t-ic { color: var(--muted); display: inline-flex; }
    .timer.running .t-ic { color: var(--green); }
    .timer .t-time { font-variant-numeric: tabular-nums; font-weight: 750; font-size: 1rem; min-width: 74px; text-align: center; }
    .timer .t-time.goal { color: var(--green); }
    .timer select { border: none; background: var(--surface-2); border-radius: 8px; padding: 4px 6px; font-size: .78rem; font-weight: 650; color: var(--text-2); cursor: pointer; }
    .timer .t-bar { width: 44px; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .timer .t-bar i { display: block; height: 100%; background: var(--green); transition: width .5s; }
    .tbtn { width: 30px; height: 30px; border-radius: 8px; border: none; display: grid; place-items: center; background: var(--surface-2); color: var(--text); }
    .tbtn:hover { background: var(--surface-3); }
    .tbtn.go { background: var(--green); color: #fff; }
    .tbtn:disabled { opacity: .4; cursor: not-allowed; }
    .save-pill { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .save-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .save-pill.pending::before { background: var(--amber); }
    .save-pill.error { color: var(--red); }
    .save-pill.error::before { background: var(--red); }
    .appbar .bar-btn { width: 36px; height: 36px; color: var(--text-2); }
    .appbar .bar-btn:hover { background: var(--surface-2); color: var(--text); }

    /* ============ Lock screen ============ */
    .lock { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; overflow-y: auto;
      background: radial-gradient(ellipse at top, #142b4d 0%, #0b0e13 62%); color: #e6eaf0; }
    .lock-card { width: min(360px, 100%); text-align: center; }
    .lock .logo { width: 54px; height: 54px; border-radius: 16px; font-size: 1.15rem; margin: 0 auto; }
    .lock-clock { font-size: 3.1rem; font-weight: 300; letter-spacing: -.02em; margin: 18px 0 0; font-variant-numeric: tabular-nums; line-height: 1; }
    .lock-date { color: #98a2b3; font-size: .9rem; margin-top: 8px; }
    .lock h1 { font-size: 1.12rem; margin: 26px 0 4px; color: #fff; }
    .lock-msg { color: #98a2b3; font-size: .88rem; min-height: 1.4em; margin: 0; }
    .lock-msg.err { color: #ff8a8d; }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0 24px; min-height: 14px; }
    .pin-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #475467; transition: background .1s, border-color .1s; }
    .pin-dots i.on { background: #e6eaf0; border-color: #e6eaf0; }
    .pin-dots.shake { animation: shake .35s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .keypad { display: grid; grid-template-columns: repeat(3, 70px); gap: 14px; justify-content: center; }
    .keypad button { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: #fff; font-size: 1.45rem; font-weight: 500; transition: background .12s; }
    .keypad button:hover { background: rgba(255,255,255,.13); }
    .keypad button:active { background: rgba(255,255,255,.22); }
    .keypad button.fn { font-size: .88rem; font-weight: 650; background: transparent; border-color: transparent; }
    .keypad button:disabled { opacity: .35; cursor: not-allowed; }
    .lock-foot { margin-top: 26px; font-size: .74rem; color: #7d8898; display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.5; }
    body.privacy .app { filter: blur(24px); }

    /* ============ 실습 시간 · 즉시 편집 ============ */
    .sessions { list-style: none; padding: 0; margin: 0 0 12px; }
    .sessions li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
    .sessions li:last-child { border-bottom: none; }
    .sessions .s-when { color: var(--muted); font-size: .78rem; min-width: 104px; font-variant-numeric: tabular-nums; }
    .sessions .s-dur { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 62px; }
    .sessions .s-memo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editable { cursor: text; border-radius: 6px; padding: 1px 5px; margin: -1px -5px; border: none; background: none; text-align: left; font: inherit; color: inherit; }
    .editable:hover { background: var(--surface-2); }
    .editable.placeholder { color: var(--faint); }
    .inline-input { padding: 4px 8px; font-size: .9rem; }
    .inline-edit { display: flex; gap: 6px; flex: 1; min-width: 0; flex-wrap: wrap; }
    .inline-edit .input { flex: 1; min-width: 120px; padding: 6px 8px; font-size: .86rem; }
    .icon-btn.plain:hover { color: var(--blue); background: var(--blue-soft); }
    .task .icon-btn.plain { opacity: 0; }
    .task:hover .icon-btn.plain, .task .icon-btn.plain:focus-visible { opacity: 1; }
    @media (hover: none) { .task .icon-btn.plain { opacity: .7; } }
    .study { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; align-items: end; height: 150px; }
    .study .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; text-decoration: none; color: inherit; min-width: 0; }
    .study .b { width: 100%; max-width: 46px; border-radius: 8px 8px 3px 3px; background: var(--blue); min-height: 3px; transition: height .4s; }
    .study .col.project .b { background: var(--orange); }
    .study .col.eval .b { background: var(--purple); }
    .study .col:hover .b { filter: brightness(1.15); }
    .study .v { font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .study .l { font-size: .72rem; color: var(--muted); }
    .ai-warn { display: flex; gap: 6px; align-items: flex-start; font-size: .78rem; color: var(--amber); margin: 10px 0 0; }
    .sec-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .sec-list li { display: flex; gap: 8px; font-size: .86rem; align-items: flex-start; }
    .sec-list li .ic { margin-top: 3px; color: var(--green); }
    .sec-list li.warn .ic { color: var(--amber); }
    @media (max-width: 900px) {
      .appbar { padding: 8px 12px; gap: 8px; }
      .appbar .menu-btn { display: grid; }
    }
    @media (max-width: 640px) {
      .appbar { gap: 6px; }
      .clock { min-width: 0; flex-shrink: 0; }
      .clock b { font-size: .9rem; }
      .clock span, .timer select, .timer .t-bar, .timer .t-ic, .save-pill .txt, #topSync { display: none; }
      .timer { gap: 4px; padding: 4px; flex-shrink: 0; }
      .timer .t-time { min-width: 60px; font-size: .9rem; }
      .appbar .bar-btn { width: 32px; height: 32px; }
      .appbar .lock-txt { display: none; }
      .study { gap: 4px; }
      .study .v { font-size: .66rem; }
    }

    /* ============ Modal / toast ============ */
    .modal { position: fixed; inset: 0; background: rgba(6, 10, 16, .72); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 24px; z-index: 50; }
    .modal-box { background: var(--surface); border-radius: 18px; width: min(1000px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .modal-head strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-body { overflow: auto; padding: 16px; display: grid; place-items: center; min-height: 200px; }
    .modal-body img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
    .modal-body iframe { width: 100%; height: 75vh; border: none; }
    .modal-body pre { width: 100%; margin: 0; white-space: pre-wrap; font-size: .85rem; font-family: var(--mono); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); z-index: 60;
      background: #101828; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .9rem; box-shadow: 0 12px 32px rgba(0,0,0,.25);
      opacity: 0; pointer-events: none; transition: .2s; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 8px; padding: 4px 10px; font-size: .82rem; font-weight: 650; }

    /* ============ REA 분석실 ============ */
    .rea-hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--border)); }
    .rea-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 18px; align-items: start; }
    .rea-drop { border: 1.5px dashed var(--border); border-radius: 16px; min-height: 150px; padding: 24px; display: grid; place-items: center; text-align: center; background: var(--surface-2); transition: .18s; }
    .rea-drop.drag { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
    .rea-drop input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; pointer-events: none; }
    .rea-status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
    .rea-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .rea-status.desktop .dot { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 14%, transparent); }
    .rea-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .rea-kpi { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); min-width: 0; }
    .rea-kpi span { display: block; color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
    .rea-kpi b { display: block; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rea-code { max-height: 380px; overflow: auto; margin: 0; padding: 14px; border-radius: 12px; background: #101828; color: #e4e7ec; font: .78rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .rea-report { border-left: 3px solid var(--accent); }
    .rea-report details { margin-top: 10px; }
    .rea-report summary { cursor: pointer; font-weight: 700; }
    .rea-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rea-note { font-size: .83rem; color: var(--muted); line-height: 1.6; }
    .rea-note strong { color: var(--text); }

    /* ============ Responsive ============ */
    @media (max-width: 1180px) {
      .s8, .s4, .s7, .s5 { grid-column: span 12; }
      .s3 { grid-column: span 6; }
      .cols, .pf-cols, .aday-grid { grid-template-columns: minmax(0, 1fr); }
      .pf-preview { position: static; }
      .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .side { position: fixed; inset: 0 auto 0 0; width: 284px; z-index: 40; transform: translateX(-100%); transition: transform .22s ease; }
      body.nav-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(6, 10, 16, .5); }
      .topbar {
        display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30;
        background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border); padding: 10px 16px;
      }
      .topbar .icon-btn { width: 36px; height: 36px; color: var(--text); border: 1px solid var(--border); }
      .topbar .icon-btn:hover { background: var(--surface-2); color: var(--text); }
      .topbar b { flex: 1; font-size: .95rem; }
      .main { padding: 20px 16px 56px; }
      .arch { grid-template-columns: minmax(0, 1fr); }
      .toc { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
      .toc .t-label { display: none; }
      .toc a { white-space: nowrap; background: var(--surface); border: 1px solid var(--border); }
      .kpt { grid-template-columns: minmax(0, 1fr); }
      .rea-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 600px) {
      .s3 { grid-column: span 12; }
      .hero { flex-direction: column; align-items: flex-start; padding: 22px; }
      .hero > div:last-child { align-self: center; }
      .ring { width: 110px; height: 110px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 16px; }
      .dhead { padding: 20px; }
      .kv { grid-template-columns: minmax(0, 1fr); }
      .kv dd { margin-bottom: 6px; }
      .note-input, .preview { min-height: 320px; }
      .filters .select { flex: 1; }
      .rea-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rea-tools { grid-template-columns: minmax(0, 1fr); }
    }
    @media print {
      .side, .topbar, .appbar, .lock, .no-print, .toast { display: none !important; }
      .app { display: block; }
      .main { padding: 0; }
      .card { box-shadow: none; break-inside: avoid; }
      body { background: #fff; }
      .clamp { max-height: none; } .clamp::after { display: none; }
    }
  
    /* ============ 글래스 테마 (파스텔 유리 카드 · 아이콘 사이드바) ============ */
    :root {
      --bg: #e4ebf5;
      --surface: rgba(255, 255, 255, .58);
      --surface-solid: #f7f9fd;
      --surface-2: rgba(255, 255, 255, .55);
      --surface-3: rgba(120, 140, 175, .16);
      --text: #111a2e;
      --text-2: #2c3a55;
      --muted: #5f6f8c;
      --faint: #8d9ab3;
      --border: rgba(255, 255, 255, .75);
      --border-strong: rgba(110, 130, 170, .28);
      --navy: #16213b;
      --blue: #4764e8;
      --blue-soft: rgba(71, 100, 232, .12);
      --purple: #8a64f0;
      --purple-soft: rgba(138, 100, 240, .13);
      --green: #17a56a;
      --green-soft: rgba(23, 165, 106, .13);
      --orange: #ee7f1c;
      --orange-soft: rgba(238, 127, 28, .14);
      --radius: 24px;
      --radius-sm: 14px;
      --shadow: 0 12px 34px -14px rgba(60, 85, 140, .30), inset 0 1px 0 rgba(255, 255, 255, .85);
      --nav-on-bg: #16213b; --nav-on-fg: #fff;
      --blob1: rgba(120, 160, 255, .45); --blob2: rgba(190, 150, 255, .35); --blob3: rgba(120, 220, 230, .35);
    }
    :root[data-theme="dark"] {
      --bg: #0a0f1d;
      --surface: rgba(255, 255, 255, .065);
      --surface-solid: #151c2e;
      --surface-2: rgba(255, 255, 255, .07);
      --surface-3: rgba(255, 255, 255, .12);
      --text: #f1f4fb;
      --text-2: #d3daea;
      --muted: #9aa7c2;
      --faint: #6f7d99;
      --border: rgba(255, 255, 255, .11);
      --border-strong: rgba(255, 255, 255, .22);
      --blue: #7b95ff;
      --blue-soft: rgba(123, 149, 255, .16);
      --shadow: 0 14px 40px -18px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .07);
      --nav-on-bg: rgba(255, 255, 255, .15); --nav-on-fg: #fff;
      --blob1: rgba(70, 100, 230, .38); --blob2: rgba(140, 80, 230, .28); --blob3: rgba(30, 150, 170, .26);
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(46vw 46vw at 8% 6%, var(--blob1), transparent 62%),
        radial-gradient(40vw 40vw at 92% 14%, var(--blob2), transparent 62%),
        radial-gradient(44vw 44vw at 70% 100%, var(--blob3), transparent 62%);
    }
    .card, .side, .appbar, .timer, .sync-pill { backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); }
    .modal-box, .toast, .lock-card { background: var(--surface-solid); }

    /* 사이드바: 떠 있는 유리 패널 + 아이콘 레일 */
    .app { grid-template-columns: 276px minmax(0, 1fr); transition: grid-template-columns .22s ease; }
    .side {
      top: 14px; height: calc(100vh - 28px); margin: 14px 0 14px 14px; border: 1px solid var(--border);
      border-radius: 28px; background: var(--surface); box-shadow: var(--shadow);
    }
    .side-foot { border-top-color: var(--border-strong); }
    .nav-item { border-radius: 14px; padding: 8px 12px; transition: background .15s, color .15s; }
    .nav-item:hover { background: var(--surface-3); }
    .nav-item.active { background: var(--nav-on-bg); color: var(--nav-on-fg); box-shadow: 0 8px 18px -10px rgba(20, 30, 60, .55); }
    .nav-item.active .count { color: inherit; opacity: .75; }
    .nav-days { border-left-color: var(--border-strong); }
    .rail-btn {
      position: absolute; top: 24px; right: -13px; width: 26px; height: 26px; border-radius: 50%; padding: 0; line-height: 1;
      border: 1px solid var(--border-strong); background: var(--surface-solid); color: var(--text-2); font-size: 15px; font-weight: 700;
      display: grid; place-items: center; box-shadow: 0 4px 10px -4px rgba(20, 30, 60, .4); z-index: 2;
    }
    .rail-btn::before { content: "‹"; margin-top: -2px; }
    .appbar {
      top: 14px; margin: 14px 40px 0; padding: 8px 18px; min-height: 58px; border: 1px solid var(--border);
      border-radius: 22px; background: var(--surface); box-shadow: var(--shadow);
    }
    .main { padding-top: 22px; }
    @media (min-width: 901px) {
      body.rail .app { grid-template-columns: 104px minmax(0, 1fr); }
      body.rail .side { overflow: visible; }
      body.rail .rail-btn::before { content: "›"; }
      body.rail .brand { padding: 20px 0 12px; justify-content: center; }
      body.rail .brand > span:last-child, body.rail .nav-label, body.rail .nav-days, body.rail .sync-pill, body.rail .local-state, body.rail .nav-item .count { display: none; }
      body.rail .side-search { font-size: 0; margin: 4px 14px 8px; justify-content: center; padding: 11px 0; }
      body.rail .side-search kbd { display: none; }
      body.rail .nav { padding: 4px 12px 12px; overflow-x: hidden; }
      body.rail .nav-item { font-size: 0; justify-content: center; padding: 12px 0; margin-bottom: 4px; }
      body.rail .nav-item .ic { width: 22px; height: 22px; }
      body.rail .side-foot { padding: 10px; }
    }
    @media (max-width: 900px) { .appbar { margin: 8px 12px 0; top: 8px; } .rail-btn { display: none; } .side { margin: 0; height: 100vh; border-radius: 0 28px 28px 0; background: var(--surface-solid); } }

    /* 대시보드 위젯 */
    .dash { gap: 18px; align-items: stretch; }
    .dash .card { padding: 20px 22px; }
    .dash .card-head { margin-bottom: 14px; }
    .dash .card-head h2 { font-size: 1.02rem; font-weight: 720; }
    .gl-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px 24px 24px; gap: 4px; }
    .gl-hello { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; font-weight: 650; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; }
    .gl-time { font-size: clamp(3.2rem, 7vw, 5.2rem); font-weight: 300; letter-spacing: -.045em; line-height: 1.02; font-variant-numeric: tabular-nums; margin-top: 8px; }
    .gl-time small { font-size: .28em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
    .gl-date { color: var(--muted); font-weight: 560; font-size: .95rem; margin-bottom: 14px; }
    .gl-search { width: min(560px, 100%); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-size: .92rem; text-align: left; box-shadow: var(--shadow); }
    .gl-search:hover { border-color: var(--border-strong); }
    .gl-search kbd { margin-left: auto; font-family: var(--font); font-size: .72rem; border: 1px solid var(--border-strong); border-radius: 6px; padding: 1px 7px; color: var(--faint); }
    .gl-now { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
    .gl-now .now { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--text-2); font-weight: 600; }
    .gl-now .now b { color: var(--text); }
    .gl-prog { display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
    .gl-prog .ringbox { display: flex; align-items: center; gap: 18px; }
    .gl-prog .ring { width: 124px; height: 124px; }
    .gl-prog .ring circle { stroke-width: 9; }
    .gl-prog .ring .ring-bg { stroke: var(--surface-3); }

    /* =========================================================
       2. 유틸리티
       ========================================================= */
    const $ = (s, root = document) => root.querySelector(s);

    function el(tag, attrs = {}, ...children) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === false || v == null) continue;
        if (k === "class") e.className = v;
        else if (k === "html") e.innerHTML = v; // md() 등 이스케이프된 HTML 전용
        else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : v);
      }
      for (const c of children.flat(Infinity)) if (c != null && c !== false) e.append(c);
      return e;
    }
    // replaceChildren에 넘길 자식 목록 (null · false 제거, 배열 펼침)
    const kids = (...a) => a.flat(Infinity).filter(x => x != null && x !== false);
    function icon(name, cls = "") {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 24 24");
      s.setAttribute("class", `ic ${cls}`.trim());
      s.setAttribute("aria-hidden", "true");
      s.innerHTML = ICONS[name] || "";
      return s;
    }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const str = v => (typeof v === "string" ? v : "");
    const obj = v => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0);
    const uid = p => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

    function safeUrl(u) {
      const s = String(u ?? "").trim();
      if (!s) return "";
      try {
        const x = new URL(s);
        return ["http:", "https:", "mailto:"].includes(x.protocol) ? x.href : "";
      } catch { return ""; }
    }
    function fmtSize(n) {
      if (!n) return "0 B";
      const u = ["B", "KB", "MB", "GB"];
      const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
      return `${(n / 1024 ** i).toFixed(i ? 1 : 0)} ${u[i]}`;
    }
    const fmtDT = ts => ts ? new Date(ts).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
    function ago(ts) {
      if (!ts) return "-";
      const s = (Date.now() - ts) / 1000;
      if (s < 45) return "방금";
      if (s < 3600) return `${Math.max(1, Math.floor(s / 60))}분 전`;
      if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
      if (s < 172800) return "어제";
      return new Date(ts).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
    }
    const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };

    function blobToDataURL(blob) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.readAsDataURL(blob);
      });
    }
    function dataURLToBlob(url) {
      const m = /^data:([^;,]*)((?:;[^;,]*)*?)(;base64)?,(.*)$/s.exec(String(url));
      if (!m) throw new Error("잘못된 파일 데이터");
      const type = m[1] || "application/octet-stream";
      if (!m[3]) return new Blob([decodeURIComponent(m[4])], { type });
      const bin = atob(m[4]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type });
    }
    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: name });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    const viewUrls = new Set();
    function objUrl(blob) { const u = URL.createObjectURL(blob); viewUrls.add(u); return u; }
    function revokeViewUrls() { viewUrls.forEach(u => URL.revokeObjectURL(u)); viewUrls.clear(); }

    function hl(text, q) {
      if (!q) return [text];
      const out = [], lower = text.toLowerCase();
      let i = 0, j;
      while ((j = lower.indexOf(q, i)) !== -1) {
        if (j > i) out.push(text.slice(i, j));
        out.push(el("mark", {}, text.slice(j, j + q.length)));
        i = j + q.length;
      }
      if (i < text.length) out.push(text.slice(i));
      return out;
    }
    function snippet(text, q, pad = 50) {
      const i = text.toLowerCase().indexOf(q);
      if (i < 0) return "";
      const s = Math.max(0, i - pad), e = Math.min(text.length, i + q.length + pad);
      return (s ? "…" : "") + text.slice(s, e).replace(/\s+/g, " ") + (e < text.length ? "…" : "");
    }
    const firstLine = s => (s.split("\n").map(l => l.replace(/^[#>*\-\s\d.)[\]x]+/i, "").trim()).find(Boolean) || "");

    /* =========================================================
       3. Markdown 렌더러 (입력 전체를 이스케이프한 뒤 변환)
       ========================================================= */
    function md(src) {
      const blocks = [];
      let s = String(src || "").replace(/\r\n?/g, "\n").replace(/[\u0000\u0001\u0002]/g, "");
      s = s.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
        blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
        return `\n\u0000${blocks.length - 1}\u0000\n`;
      });
      let html = "", list = null, para = [];
      const flush = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
      const close = () => { if (list) { html += `</${list}>`; list = null; } };
      const open = t => { if (list !== t) { close(); html += `<${t}>`; list = t; } };
      for (const line of s.split("\n")) {
        let m;
        const t = line.trim();
        if (/^\u0000\d+\u0000$/.test(t)) { flush(); close(); html += t; continue; }
        if (!t) { flush(); close(); continue; }
        if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flush(); close(); const n = m[1].length + 1; html += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flush(); close(); html += "<hr>"; continue; }
        if ((m = line.match(/^>\s?(.*)$/))) { flush(); close(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
        if ((m = line.match(/^\s*[-*]\s+\[( |x|X)\]\s?(.*)$/))) { flush(); open("ul"); html += `<li class="todo">${m[1] === " " ? "☐" : "☑"} ${inline(m[2])}</li>`; continue; }
        if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flush(); open("ul"); html += `<li>${inline(m[1])}</li>`; continue; }
        if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flush(); open("ol"); html += `<li>${inline(m[1])}</li>`; continue; }
        close();
        para.push(line);
      }
      flush(); close();
      return html.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
    }
    function inline(text) {
      const keep = [];
      const hold = h => { keep.push(h); return `\u0001${keep.length - 1}\u0002`; };
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${c}</code>`));
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, label, u) => {
        const url = safeUrl(u.replace(/&amp;/g, "&"));
        return url ? hold(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`) : all;
      });
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (all, pre, u) => {
        const url = safeUrl(u.replace(/&amp;/g, "&"));
        return url ? pre + hold(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${u}</a>`) : all;
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
           .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
           .replace(/~~([^~]+)~~/g, "<del>$1</del>");
      for (let n = 0; n < 3 && /\u0001\d+\u0002/.test(s); n++) s = s.replace(/\u0001(\d+)\u0002/g, (_, i) => keep[+i]);
      return s;
    }

    /* =========================================================
       4. 브라우저 저장소 (IndexedDB, 실패 시 메모리 + localStorage 미러)
       ========================================================= */
    const DB = {
      db: null,
      mem: { kv: new Map(), files: new Map() },
      async open() {
        if (!("indexedDB" in window)) throw new Error("IndexedDB 미지원");
        this.db = await new Promise((res, rej) => {
          const r = indexedDB.open(DB_NAME, 1);
          r.onupgradeneeded = () => {
            const db = r.result;
            if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
            if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error("다른 탭이 데이터베이스를 사용 중입니다"));
        });
        this.db.onversionchange = () => { this.db.close(); this.db = null; };
      },
      run(store, mode, fn) {
        if (!this.db) {
          const r = fn(null);
          return Promise.resolve(r && typeof r === "object" && "result" in r ? r.result : undefined);
        }
        return new Promise((res, rej) => {
          const t = this.db.transaction(store, mode);
          const req = fn(t.objectStore(store));
          t.oncomplete = () => res(req ? req.result : undefined);
          t.onerror = () => rej(t.error);
          t.onabort = () => rej(t.error || new Error("저장이 중단되었습니다"));
        });
      },
      get(store, key) { return this.run(store, "readonly", s => (s ? s.get(key) : { result: this.mem[store].get(key) })); },
      put(store, value, key) {
        return this.run(store, "readwrite", s => {
          if (s) return key === undefined ? s.put(value) : s.put(value, key);
          this.mem[store].set(key ?? value.id, value);
        });
      },
      del(store, key) { return this.run(store, "readwrite", s => (s ? s.delete(key) : void this.mem[store].delete(key))); },
      all(store) { return this.run(store, "readonly", s => (s ? s.getAll() : { result: [...this.mem[store].values()] })); },
      clear(store) { return this.run(store, "readwrite", s => (s ? s.clear() : void this.mem[store].clear())); },
    };

    /* =========================================================
       4-1. 암호화 금고 (PIN → PBKDF2-SHA256 → AES-GCM 256)
