          size: Math.max(0, num(x.size)), sha256: str(x.sha256).slice(0, 64), format: str(x.format).slice(0, 40),
          source: x.source === "desktop" ? "desktop" : "offline", tool: str(x.tool).slice(0, 40), report: x.report.slice(0, 120000),
        }));
      }
      const st = obj(raw.sites);
      s.sites = {
        custom: Array.isArray(st.custom) ? st.custom.filter(x => x && typeof x.url === "string" && typeof x.title === "string").map(x => ({
          id: str(x.id) || uid("s"), cat: SITE_CATS.some(c => c[0] === x.cat) ? x.cat : "etc", title: x.title.slice(0, 120), url: x.url,
          desc: str(x.desc).slice(0, 300), day: dayNo(x.day), createdAt: num(x.createdAt) || Date.now(),
        })) : [],
        hidden: bools(st.hidden), fav: bools(st.fav),
        visits: Object.fromEntries(Object.entries(obj(st.visits)).filter(([, v]) => Number.isInteger(v) && v > 0)),
      };
      const tm = obj(raw.timer);
      s.timer = {
        running: tm.running === true && num(tm.startedAt) > 0, startedAt: num(tm.startedAt), acc: Math.max(0, num(tm.acc)),
        firstAt: num(tm.firstAt), day: dayNo(tm.day), target: TIMER_TARGETS.includes(tm.target) ? tm.target : 0, notified: tm.notified === true,
      };
      if (!s.timer.running) s.timer.startedAt = 0;
      if (Array.isArray(raw.sessions)) {
        s.sessions = raw.sessions.filter(x => x && num(x.sec) > 0).slice(-2000).map(x => ({
          id: str(x.id) || uid("t"), day: dayNo(x.day), start: num(x.start), end: num(x.end),
          sec: Math.min(86400, Math.round(num(x.sec))), memo: str(x.memo).slice(0, 300),
        }));
      }
      s.renamed = Object.fromEntries(Object.entries(obj(raw.renamed)).filter(([, v]) => typeof v === "string" && v.trim()).map(([k, v]) => [k, v.slice(0, 300)]));
      const sec = obj(raw.security);
      s.security = { autoLock: AUTOLOCK_OPTIONS.includes(sec.autoLock) ? sec.autoLock : 15, blur: sec.blur !== false };
      const p = obj(raw.profile);
      for (const k of Object.keys(s.profile)) s.profile[k] = str(p[k]);
      for (const d of DAYS) {
        const e = obj(obj(raw.dayEdit)[d.no]), out = {};
        for (const k of ["title", "deliv"]) if (str(e[k]).trim()) out[k] = str(e[k]).trim().slice(0, 120);
        if (Object.keys(out).length) s.dayEdit[d.no] = out;
      }
      if (Array.isArray(raw.projects)) s.projects = raw.projects.slice(0, 200).map(cleanProject);
      else if (raw.updatedAt) {
        // 이전 버전 기록: 기본 배포 목록을 처음 한 번 채우고, 비어 있던 DAY 4 결과물 주소도 확인된 배포 주소로 채움
        const d4 = s.days[4].deliv;
        if (!d4.link.trim()) d4.link = "https://day4-ten-theta.vercel.app";
      }
      s.createdAt = num(raw.createdAt) || s.createdAt;
      s.updatedAt = num(raw.updatedAt);
      s.lastBackup = num(raw.lastBackup);
      return s;
    }
    function fromLegacy(l) {
      l = obj(l);
      const days = {};
      for (const d of DAYS) days[d.no] = { note: str(obj(l.memo)[d.no]), deliv: obj(obj(l.deliv)[d.no]) };
      return { done: l.done, removed: l.removed, custom: l.custom, final: l.final, days, updatedAt: Date.now() };
    }
    const isLegacy = l => l && typeof l === "object" && !l.app && ("done" in l || "memo" in l) && !("days" in l);
    const validFile = r => r && typeof r.id === "string" && r.blob instanceof Blob && typeof r.name === "string";
    const FILE_KINDS = ["material", "deliverable", "profile", "qr"];
    function toRec(m, blob) {
      m = obj(m);
      return {
        id: str(m.id) || uid("f"), day: Number.isInteger(m.day) && m.day >= 0 && m.day <= 8 ? m.day : 0,
        kind: FILE_KINDS.includes(m.kind) ? m.kind : "material",
        name: str(m.name) || "이름없음", type: str(m.type) || blob.type || "application/octet-stream",
        size: blob.size, createdAt: num(m.createdAt) || Date.now(), blob,
      };
    }

    let state = defaultState();
    let files = [];
    let storageMode = "idb";

    /* =========================================================
       6. 자동 저장 (브라우저)
       ========================================================= */
    let saveTimer = null, dirty = false;
    const channel = "BroadcastChannel" in window ? new BroadcastChannel(APP_ID) : null;

    function touch() {
      state.updatedAt = Date.now();
      dirty = true;
      setSaveState("pending");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 450);
    }
    let lastSavedAt = 0, leaving = false;
    // 저장은 항상 암호화된 형태로만 (IndexedDB + localStorage 사본)
    async function flushSave() {
      clearTimeout(saveTimer);
      if (!dirty || !Vault.unlocked) return true;
      dirty = false;
      let sealed;
      try { sealed = { at: state.updatedAt, ...(await Vault.seal(state)) }; }
      catch { dirty = true; setSaveState("error"); return false; }
      let mirrored = false;
      try { localStorage.setItem(MIRROR_KEY, JSON.stringify(sealed)); mirrored = true; } catch {}
      try {
        await DB.put("kv", sealed, "state");
        lastSavedAt = Date.now();
        setSaveState(storageMode === "memory" && !mirrored ? "error" : "saved");
        channel?.postMessage({ from: TAB_ID, at: state.updatedAt });
        Sync.schedule();
        return true;
      } catch {
        dirty = true;
        if (mirrored) lastSavedAt = Date.now();
        setSaveState(mirrored ? "mirror" : "error");
        Sync.schedule();
        return false;
      }
    }
    function setSaveState(kind) {
      const n = $("#saveState");
      const t = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      n.className = `save-pill${kind === "pending" ? " pending" : kind === "error" ? " error" : ""}`;
      const text = {
        pending: "저장 중…",
        saved: `자동 저장됨 · ${t}`,
        mirror: `임시 저장됨 · ${t}`,
        error: "저장 실패 — 백업을 내보내세요",
      }[kind];
      n.title = kind === "saved" ? "모든 기록이 암호화되어 이 기기에 저장되었어요" : text;
      n.replaceChildren(el("span", { class: "txt" }, text));
    }
    window.addEventListener("beforeunload", e => {
      if (leaving || !Vault.unlocked || (!dirty && !Sync.pendingWrite())) return;
      flushSave();
      e.preventDefault();
      e.returnValue = "";
    });
    document.addEventListener("visibilitychange", () => {
      if (!Vault.unlocked) return;
      if (document.hidden) { flushSave(); Sync.flushNow(); }
      // 다시 이 창으로 돌아오면: 그사이 다른 창 · PC가 저장한 최신 기록이 있는지 확인해 자동으로 맞춤
      else if (Sync.server && Sync.handle && Sync.status === "ok" && !Sync.running && !dirty && !Sync.dirty) {
        readFolderArchive(Sync.handle).then(remote => {
          const rAt = archiveAt(remote);
          if (remote && rAt > Sync.knownAt + 1000) {
            Sync.knownAt = rAt;
            restoreFromFolder(Sync.handle, remote).then(ok => { if (ok) toast("다른 창에서 저장한 최신 기록으로 맞췄어요"); });
          }
        }).catch(() => {});
      }
      // 다른 창으로 전환할 때 화면 내용 가리기 (작업 전환 미리보기 · 화면 공유 노출 방지)
      document.body.classList.toggle("privacy", document.hidden && state.security.blur);
    });
    channel?.addEventListener("message", e => {
      if (e.data?.from === TAB_ID || !Vault.unlocked) return;
      toast("다른 탭에서 내용이 변경되었어요", reloadFromStore, "불러오기", 10000);
    });
    async function reloadFromStore() {
      await flushSave();
      await loadState();
      files = await loadFiles();
      route();
    }

    // 저장된 기록 불러오기 (암호화본 복호화, 이전 버전의 평문은 암호화로 전환)
    async function loadState() {
      let fromDb = null, mirror = null, legacy = null;
      try { fromDb = await DB.get("kv", "state"); } catch {}
      try { mirror = JSON.parse(localStorage.getItem(MIRROR_KEY) || "null"); } catch {}
      try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); } catch {}
      const at = v => num(v?.at ?? v?.updatedAt);
      const candidates = [fromDb, mirror].filter(Boolean).sort((a, b) => at(b) - at(a));
      let raw = null, needsSave = false, migrated = false, converted = false;
      for (const c of candidates) {
        if (isSealed(c)) {
          try { raw = await Vault.open(c); needsSave = c !== fromDb; break; } catch { console.warn("저장본을 열 수 없어 다른 사본을 확인합니다"); }
        } else if (c && typeof c === "object") {
          raw = c; needsSave = true; converted = true; break; // 이전 버전의 평문 → 암호화해서 다시 저장
        }
      }
      if (!raw && candidates.length) throw new Error("저장된 기록을 열 수 없어요. 다른 PIN으로 만든 기록일 수 있어요.");
      if (!raw && legacy) { raw = fromLegacy(legacy); migrated = true; needsSave = true; }
      state = normalize(raw);
      return { needsSave, migrated, converted };
    }

    // 파일 저장 · 불러오기 (이름 · 종류 등 정보와 내용 모두 암호화)
    async function storeFile(rec) {
      const { blob, ...meta } = rec;
      await DB.put("files", { id: rec.id, enc: 1, meta: await Vault.seal(meta), blob: await Vault.sealBlob(blob) });
    }
    async function loadFiles() {
      let rows = [];
      try { rows = (await DB.all("files")) || []; } catch {}
      const out = [], plain = [];
      for (const r of rows) {
        try {
          if (r && r.enc === 1) {
            const m = await Vault.open(r.meta);
            out.push({ ...m, id: r.id, blob: await Vault.openBlob(r.blob, m.type) });
          } else if (validFile(r)) {
            out.push(r);
            plain.push(r);
          }
        } catch { console.warn("파일을 복호화하지 못했어요:", r?.id); }
      }
      for (const r of plain) { try { await storeFile(r); } catch {} }
      return out.filter(validFile);
    }

    /* =========================================================
       7. 폴더 자동 저장 (File System Access API)
          선택한 폴더(OneDrive · Google Drive · USB 등)에
          archive.json + files/ + 수업노트.md 를 계속 저장
       ========================================================= */
    const Sync = {
      supported: typeof window.showDirectoryPicker === "function",
      handle: null,
      status: "off", // off | ok | syncing | need-permission | error | unsupported
      error: "",
      lastSync: 0,
      timer: null,
      running: false,
      again: false,
      dirty: false,

      pendingWrite() { return this.handle && (this.dirty || this.running) && this.status !== "need-permission"; },
      set(status, error = "") { this.status = status; this.error = error; renderSyncUI(); },

      server: false,
      async init() {
        // start.bat(로컬 서버)으로 열면 PC 폴더(data)에 자동 저장 — 폴더 선택 · 권한 확인 없이 어느 브라우저에서나 같은 기록
        if (AI.server?.store) {
          this.server = true;
          this.handle = ServerStore;
          try { this.lastSync = num(await DB.get("kv", "lastSync")); } catch {}
          this.set("ok");
          await this.checkRemote();
          this.dirty = true;
          this.schedule(400);
          return;
        }
        if (!this.supported) { this.set("unsupported"); return; }
        let h = null;
        try { h = await DB.get("kv", "dirHandle"); } catch {}
        if (!h || typeof h.getDirectoryHandle !== "function") { this.set("off"); return; }
        this.handle = h;
        try { this.lastSync = num(await DB.get("kv", "lastSync")); } catch {}
        if (await this.permitted(false)) {
          this.set("ok");
          await this.checkRemote();
          this.dirty = true;
          this.schedule(400);
        } else {
          this.set("need-permission");
        }
      },
      async permitted(ask) {
        const h = this.handle;
        if (!h) return false;
        if (typeof h.queryPermission !== "function") return true;
        const opts = { mode: "readwrite" };
        try {
          if ((await h.queryPermission(opts)) === "granted") return true;
          if (ask) return (await h.requestPermission(opts)) === "granted";
        } catch {}
        return false;
      },
      async connect() {
        if (!this.supported) { toast("이 브라우저는 폴더 자동 저장을 지원하지 않아요. Chrome 또는 Edge에서 열어 주세요.", null, null, 7000); return; }
        let h;
        try {
          h = await window.showDirectoryPicker({ id: "jnu-bootcamp-archive", mode: "readwrite", startIn: "documents" });
        } catch (e) {
          if (e?.name !== "AbortError") toast(`폴더를 열 수 없어요 (${e?.message || e?.name})`, null, null, 6000);
          return;
        }
        const remote = await readFolderArchive(h);
        if (remote) {
          const when = fmtDT(archiveAt(remote) || Date.parse(remote.savedAt));
          if (confirm(`'${h.name}' 폴더에 저장된 아카이브가 있어요 (마지막 수정 ${when}).\n\n[확인] 폴더의 기록을 불러와 이어서 쓰기\n[취소] 다른 방법 선택`)) {
            if (!(await restoreFromFolder(h, remote))) return;
          } else if (!confirm(`지금 이 브라우저의 기록으로 '${h.name}' 폴더의 아카이브를 덮어쓸까요?\n폴더에 있던 기존 기록은 사라져요.`)) {
            return;
          }
        }
        this.handle = h;
        try { await DB.put("kv", h, "dirHandle"); } catch {}
        this.set("ok");
        this.dirty = true;
        await this.run();
        if (this.status === "ok") toast(`'${h.name}' 폴더에 자동 저장을 시작했어요`);
      },
      async reconnect() {
        if (!this.handle) return this.connect();
        if (await this.permitted(true)) {
          this.set("ok");
          await this.checkRemote();
          this.dirty = true;
          await this.run();
          if (this.status === "ok") toast("폴더 자동 저장을 다시 시작했어요");
        } else {
          toast("폴더 접근이 허용되지 않았어요. 다시 시도하거나 폴더를 새로 선택하세요.", null, null, 6000);
        }
      },
      async disconnect() {
        if (!confirm("폴더 자동 저장을 끌까요?\n폴더에 이미 저장된 파일은 그대로 남아 있어요.")) return;
        clearTimeout(this.timer);
        this.handle = null;
        this.dirty = false;
        try { await DB.del("kv", "dirHandle"); } catch {}
        this.set("off");
      },
      schedule(ms = 1200) {
        this.dirty = true;
        if (!this.handle || !["ok", "error", "syncing"].includes(this.status)) return;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.run(), ms);
      },
      flushNow() { if (this.dirty && this.handle && this.status === "ok") { clearTimeout(this.timer); this.run(); } },
      knownAt: 0, // 이 창이 마지막으로 확인한 저장소 기록 시각 (다른 창 · PC의 저장을 알아차리기 위해)
      async checkRemote() {
        const remote = await readFolderArchive(this.handle);
        if (Number(remote?.appVer) > APP_VER) { outdatedApp(); return; }
        const rAt = archiveAt(remote);
        this.knownAt = Math.max(this.knownAt, rAt);
        if (remote && rAt > state.updatedAt + 2000) {
          const empty = !files.length && !state.updatedAt;
          // 이 브라우저에 아직 기록이 없으면 묻지 않고 바로 불러옴 (빈 기록으로 폴더를 덮어쓰는 일 방지)
          if (empty && remote.enc && remote.enc.dekId !== Vault.meta?.dekId && Vault.pin) {
            const raw = await Vault.unwrap(remote.enc, Vault.pin);
            if (raw) await Vault.adopt(remote.enc, raw);
          }
          if (empty || Vault.portable || confirm(`'${this.handle.name}' 폴더에 더 최근 기록이 있어요 (${fmtDT(rAt)}).\n다른 브라우저나 PC에서 작업한 내용일 수 있어요.\n\n[확인] 폴더의 최신 기록 불러오기\n[취소] 지금 브라우저 기록 유지 (폴더 내용을 덮어씀)`)) {
            const ok = await restoreFromFolder(this.handle, remote);
            if (!ok) {
              // 불러오지 못했으면 폴더의 기록을 지키기 위해 자동 저장을 멈춤
              this.blocked = true;
              this.set("error", "저장된 기록을 열지 못해 자동 저장을 멈췄어요");
            }
          }
        }
      },
      async run() {
        if (!this.handle || this.status === "need-permission" || this.blocked) return;
        if (this.running) { this.again = true; return; }
        this.running = true;
        this.dirty = false;
        this.set("syncing");
        try {
          // 저장 직전 확인: 이 창이 모르는 사이 다른 창 · PC가 더 최근 기록을 저장했다면 덮어쓰지 않고 먼저 묻기
          if (this.knownAt) {
            const remote = await readFolderArchive(this.handle);
            if (Number(remote?.appVer) > APP_VER) { this.running = false; outdatedApp(); return; }
            const rAt = archiveAt(remote);
            // 이 창의 시각(updatedAt)이 더 늦어도 묻는다: 오래 열어 둔 창에서 타이머만 눌러도 시각은 새로워지기 때문
            if (remote && rAt > this.knownAt + 1000) {
              this.running = false;
              this.set("ok");
              if (confirm(`다른 창이나 PC에서 더 최근 기록이 저장됐어요 (${fmtDT(rAt)}).\n\n[확인] 최신 기록 불러오기 (이 창에서 방금 바꾼 내용은 반영되지 않아요)\n[취소] 이 창의 기록으로 덮어쓰기`)) {
                this.knownAt = rAt;
                this.dirty = false;
                await restoreFromFolder(this.handle, remote);
                return;
              }
              this.knownAt = rAt;
              this.running = true;
              this.set("syncing");
            }
          }
          await writeFolderArchive(this.handle);
          this.knownAt = Math.max(this.knownAt, state.updatedAt);
          this.lastSync = Date.now();
          DB.put("kv", this.lastSync, "lastSync").catch(() => {});
          this.set("ok");
        } catch (e) {
          this.dirty = true;
          if (e?.name === "NotAllowedError" || e?.name === "SecurityError") this.set("need-permission");
          else if (e?.name === "NotFoundError") this.set("error", "폴더를 찾을 수 없어요 (이동 또는 삭제됨)");
          else if (e?.name === "QuotaExceededError") this.set("error", "디스크 공간이 부족해요");
          else if (e?.name === "OutdatedError") outdatedApp();
          else if (e?.name === "StaleError") {
            // 서버가 오래된 기록의 덮어쓰기를 막음 → 최신 기록을 불러와 맞춤
            this.dirty = false;
            this.set("ok");
            const remote = await readFolderArchive(this.handle);
            if (remote) {
              this.knownAt = archiveAt(remote);
              toast("다른 창이나 PC에서 저장한 최신 기록을 불러왔어요 (이 창의 마지막 변경은 반영되지 않았어요)", null, null, 8000);
              await restoreFromFolder(this.handle, remote);
            }
          }
          else this.set("error", e?.message || "알 수 없는 오류");
        } finally {
          this.running = false;
          if (this.again) { this.again = false; this.schedule(600); }
        }
      },
    };

    const archiveAt = a => num(a?.at ?? a?.state?.updatedAt);
    async function writeFsFile(dir, name, data) {
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      try { await w.write(data); await w.close(); }
      catch (e) { try { await w.abort(); } catch {} throw e; }
    }
    /* 로컬 서버의 data 폴더를 폴더 핸들처럼 쓰는 어댑터 (writeFolderArchive · restoreFromFolder 그대로 재사용).
       서버에는 이미 암호화된 내용만 오가므로 서버는 기록을 읽을 수 없음 */
    const storeUrl = p => `/api/store/file?path=${encodeURIComponent(p)}`;
    async function storeFetch(url, init) {
      const r = await fetch(url, { cache: "no-store", ...init });
      if (r.status === 404) throw Object.assign(new Error("없는 파일"), { name: "NotFoundError" });
      if (r.status === 409) {
        const j = await r.json().catch(() => null);
        if (j?.error?.outdated) throw Object.assign(new Error(j.error.message), { name: "OutdatedError" });
        throw Object.assign(new Error("다른 창이나 PC에서 더 최근 기록이 저장돼 있어요"), { name: "StaleError" });

    }
    function storeDir(prefix) {
      const full = n => (prefix ? `${prefix}/${n}` : n);
      return {
        kind: "directory",
        async getDirectoryHandle(n) { return storeDir(full(n)); },
        async getFileHandle(n) {
          const p = full(n);
          return {
            kind: "file", name: n,
            async getFile() { return (await storeFetch(storeUrl(p))).blob(); },
            async createWritable() {
              const parts = [];
              return {
                async write(d) { parts.push(d); },
                async close() { await storeFetch(storeUrl(p), { method: "PUT", body: new Blob(parts) }); },
                async abort() { parts.length = 0; },
              };
            },
          };
        },
        async removeEntry(n) { await storeFetch(storeUrl(full(n)), { method: "DELETE" }); },
        async *entries() {
          const { names } = await (await storeFetch(`/api/store/list?dir=${prefix === "files" ? "files" : ""}`)).json();

    const ServerStore = Object.assign(storeDir(""), { name: "부트캠프_아카이브\\data" });

    // 폴더에는 암호화된 파일만 저장 (archive.json · files/*.bin). 파일 이름도 노출되지 않음
    // 파일 이름에 키 표시를 붙여, 키가 바뀌어도 기존 파일을 덮어쓰지 않고 새로 쓴 뒤 목록을 바꿈 (중간에 끊겨도 안전)
    async function writeFolderArchive(h) {
      const tag = String(Vault.meta.dekId).toLowerCase().replace(/[^0-9a-z]/g, "").slice(0, 6) || "k";
      const fdir = await h.getDirectoryHandle("files", { create: true });

      for await (const [name, entry] of fdir.entries()) if (entry.kind === "file") existing.add(name);
      const keep = new Set(), metas = [];

        const path = `${f.id}-${tag}.bin`;

        metas.push({ id: f.id, day: f.day, kind: f.kind, name: f.name, type: f.type, size: f.size, createdAt: f.createdAt, path });
      }
      // 파일을 먼저 쓰고 마지막에 목록(archive.json)을 써서, 목록이 가리키는 파일이 항상 존재하도록
      // base: 이 창이 마지막으로 확인한 저장본의 시각. 서버는 그 뒤에 다른 창이 저장한 적이 있으면 덮어쓰기를 거절
      const archive = { app: APP_ID, schema: SCHEMA, appVer: APP_VER, savedAt: new Date().toISOString(), at: state.updatedAt, base: Sync.knownAt || 0, enc: Vault.publicInfo(), payload: await Vault.seal({ state, files: metas }) };
      await writeFsFile(h, "archive.json", JSON.stringify(archive));
      await writeFsFile(h, "README.txt",
        "이 폴더는 '나의 수업 아카이브'(index.html)가 자동으로 저장하는 폴더입니다.\r\n\r\n" +
        "- archive.json : 노트 · 체크 · 링크 · 프로필 등 모든 기록 (PIN으로 암호화)\r\n- files/ : 업로드한 강의 자료와 결과물 (암호화된 .bin 파일)\r\n\r\n" +
        "내용은 PIN 없이는 열 수 없어요. 바탕화면의 '나의 수업 아카이브'(또는 start.bat)로 열면 자동으로 이어져요.\r\n" +
        "다른 PC에서는 이 폴더를 [백업 · 동기화] > [저장 폴더 연결]로 선택한 뒤 PIN을 입력하세요.\r\n" +
        "이 폴더의 파일 이름을 바꾸거나 지우지 마세요.\r\n");
      // 이전 버전이 남긴 평문 파일 정리 (개인정보 노출 방지)
      try { await h.removeEntry("수업노트.md"); } catch {}
      for (const name of existing) {
        if (!keep.has(name) && /^f[0-9a-z]+(__.*|(-[0-9a-z]+)?\.bin)$/.test(name)) { try { await fdir.removeEntry(name); } catch {} }
      }
    }
    async function readFolderArchive(h) {
      try {
        const fh = await h.getFileHandle("archive.json");
        const data = JSON.parse(await (await fh.getFile()).text());
        return data && data.app === APP_ID && (data.state || isSealed(data.payload)) ? data : null;
      } catch { return null; }
    }
    // 저장된 기록이 이 창보다 새 버전의 앱으로 저장됨 → 자동 저장을 멈추고 새로고침을 안내 (예전 화면이 새 필드를 지우지 않도록)
    function outdatedApp() {
      Sync.blocked = true;
      Sync.dirty = false;
      Sync.set("error", "앱이 업데이트됐어요 · 새로고침(F5)하면 이어서 저장돼요");
      toast("앱이 새 버전으로 업데이트됐어요. 새로고침하면 최신 기록으로 이어서 쓸 수 있어요", () => { window.leaving = true; location.reload(); }, "새로고침", 60000);
    }
    // USB에서 처음 불러오는 동안 화면을 가림: 불러오기 전의 빈 기록을 진짜 기록으로 착각하거나 고치지 않도록
    const UsbLoading = {
      el: null,
      show() {
        if (this.el) return;
        this.el = el("div", { class: "usb-loading", role: "status", "aria-live": "polite" },
          el("div", { class: "usb-loading-box" }, el("span", { class: "usb-spin" }), el("b", {}, "USB에서 기록을 불러오는 중…"), el("span", { class: "usb-loading-n" }, "기록 확인 중")));
        document.body.append(this.el);
      },
      progress(n, total) { const t = this.el?.querySelector(".usb-loading-n"); if (t) t.textContent = `파일 ${n} / ${total}`; },
      hide() { this.el?.remove(); this.el = null; },
    };
    async function restoreFromFolder(h, data) {
      let key = null, st = data.state, metas = data.files;
      if (isSealed(data.payload)) {
        key = await keyForArchive(data.enc, "저장 폴더의 기록");
        if (!key) { toast("폴더 기록을 불러오지 않았어요"); return false; }
        try { const p = await Vault.open(data.payload, key); st = p.state; metas = p.files; }
        catch { toast("폴더 기록을 열 수 없어요 (손상되었거나 PIN이 달라요)", null, null, 7000); return false; }
      }
      toast("폴더에서 기록을 불러오는 중…", null, null, 60000);
      let fdir = null;
      try { fdir = await h.getDirectoryHandle("files"); } catch {}
      const list = Array.isArray(metas) ? metas : [];
      const slots = new Array(list.length), missing = [];
      let next = 0, done = 0;
      // 파일을 여러 개씩 동시에 받아서 복호화 (USB에서 처음 열 때 기다리는 시간을 줄임). 순서는 원래대로 유지

        while (next < list.length) {
          const i = next++, m = list[i];
          try {
            const file = await (await fdir.getFileHandle(str(m.path))).getFile();
            const blob = key ? await Vault.openBlob(file, str(m.type), key) : new Blob([await file.arrayBuffer()], { type: str(m.type) || file.type });
            slots[i] = toRec(m, blob);
          } catch { missing.push(str(m.name)); }

        }
      };
      await Promise.all(Array.from({ length: Math.min(6, list.length) }, worker));

      const ok = await applyRestore(st, recs);
      if (ok) toast(missing.length ? `불러오기 완료 · 찾지 못한 파일 ${missing.length}개` : `폴더에서 불러오기 완료 · 파일 ${recs.length}개`, null, null, 6000);

    }

    // 상태와 파일을 통째로 교체. 실패하면 원래 데이터로 되돌림
    async function applyRestore(rawState, recs) {
      const prevState = state, prevFiles = files;
      try {
        await DB.clear("files");
        for (const r of recs) await storeFile(r);
        state = normalize(rawState);
        // 불러온 기록을 '지금' 저장된 것으로 표시 (오래된 백업을 복원해도 서버의 덮어쓰기 보호에 막히지 않도록)
        state.updatedAt = Date.now();
        files = recs;
        dirty = true;
        await flushSave();
        route();
        return true;
      } catch (e) {
        try {
          await DB.clear("files");
          for (const r of prevFiles) await storeFile(r);
        } catch {}
        state = prevState; files = prevFiles; dirty = true;
        await flushSave();
        route();
        toast(`복원 실패: ${e?.name === "QuotaExceededError" ? "저장 공간이 부족해요" : "저장 중 오류"} · 원래 기록을 유지했어요`, null, null, 8000);
        return false;
      }
    }

    function syncInfo() {
      const name = Sync.handle?.name || "";

        case "ok": return { cls: "ok", dot: "ok", ic: "cloudCheck", title: Vault.portable ? "USB에 자동 저장 중" : Sync.server ? "PC 폴더에 자동 저장 중" : "폴더에 자동 저장 중", sub: Sync.lastSync ? `${name} · ${ago(Sync.lastSync)} 저장` : name };
        case "syncing": return { cls: "ok", dot: "busy", ic: "cloudCheck", title: Vault.portable ? "USB에 저장 중…" : Sync.server ? "PC 폴더에 저장 중…" : "폴더에 저장 중…", sub: name };
        case "need-permission": return { cls: "warn", dot: "warn", ic: "alert", title: "폴더 연결 확인 필요", sub: `${name} · 클릭 한 번으로 다시 연결`, action: ["다시 연결", () => Sync.reconnect()] };
        case "error": return { cls: "err", dot: "err", ic: "alert", title: "폴더 저장 오류", sub: Sync.error, action: ["다시 시도", async () => {
          if (Sync.blocked) { Sync.blocked = false; Sync.set("ok"); await Sync.checkRemote(); if (!Sync.blocked) Sync.schedule(300); }

        default: return { cls: "off", dot: "", ic: "cloudOff", title: "브라우저에만 저장 중", sub: "저장 폴더를 연결하면 PC에도 보관돼요", action: ["저장 폴더 연결", () => Sync.connect()] };
      }
    }
    function renderSyncUI() {
      const s = syncInfo();
      $("#syncPill").replaceChildren(el("div", { class: "sync-pill" },
        el("div", { class: "sp-head" }, el("span", { class: `sdot ${s.dot}` }), s.title),
        el("div", { class: "sp-sub", title: s.sub }, s.sub),
        s.action ? el("button", { class: `btn sm ${s.cls === "off" ? "accent" : ""}`, onclick: s.action[1] }, s.action[0]) : null));

    function syncCard(variant = "compact") {

          : "모든 기록과 파일이 선택한 폴더에도 자동으로 저장되고 있어요. 클라우드 폴더라면 다른 PC에서도 이어 쓸 수 있어요.",
        warn: "브라우저 보안 정책상 다시 열 때마다 폴더 접근을 한 번 확인해야 해요. 버튼을 누르면 바로 이어서 저장돼요.",
        err: "폴더에 저장하지 못했어요. 폴더가 옮겨졌다면 다시 선택해 주세요. 기록은 브라우저에 안전하게 남아 있어요.",

          : "이 브라우저는 폴더 자동 저장을 지원하지 않아요. Chrome 또는 Edge로 열면 폴더에 자동 저장할 수 있어요. 그 전까지는 백업 파일을 내보내 주세요.",

        el("div", { class: "sc-top" },

        Sync.handle ? el("dl", {},
          el("dt", {}, "저장 폴더"), el("dd", {}, Sync.handle.name),
          el("dt", {}, "마지막 저장"), el("dd", {}, Sync.lastSync ? `${fmtDT(Sync.lastSync)} (${ago(Sync.lastSync)})` : "-")) : null,

    /* =========================================================
       8. 도메인 함수
       ========================================================= */
    const dayDate = d => new Date(d.date[0], d.date[1] - 1, d.date[2]);
    const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); };
    const isToday = d => dayDate(d).getTime() === today0();
    const fmtDay = d => `${d.date[1]}/${d.date[2]}(${WEEK[dayDate(d).getDay()]})`;
    const hours = d => (d.half ? "09:00–13:00" : "09:00–17:50");
    const dayLabel = no => (no >= 1 && no <= 8 ? `DAY ${no}` : "공통");

    function tasksOf(d) {
      const base = d.tasks.map((text, i) => ({ id: `d${d.no}-${i}`, text: state.renamed[`d${d.no}-${i}`] || text, original: text, custom: false })).filter(t => !state.removed[t.id]);
      return [...base, ...(state.custom[d.no] || []).map(t => ({ ...t, custom: true }))];
    }
    function dayProgress(d) {
      const ts = tasksOf(d);
      const total = ts.length + 1;
      const done = ts.filter(t => state.done[t.id]).length + (state.days[d.no].deliv.done ? 1 : 0);
      return { done, total, pct: Math.round((done / total) * 100) };
    }
    function dayStatus(d) {
      const p = dayProgress(d), t = dayDate(d).getTime(), now = today0();
      if (p.done === p.total) return { cls: "done", text: "완료" };
      if (t === now) return { cls: "today", text: "오늘" };
      if (t < now) return { cls: "late", text: `남은 항목 ${p.total - p.done}` };
      return { cls: "", text: `D-${Math.round((t - now) / 86400000)}` };
    }
    function totals() {
      let done = 0, total = 0;
      const phase = { learn: [0, 0], project: [0, 0], eval: [0, 0] };
      for (const d of DAYS) {
        const p = dayProgress(d);
        done += p.done; total += p.total;
        phase[d.phase][0] += p.done; phase[d.phase][1] += p.total;
      }
      return { done, total, pct: Math.round((done / total) * 100), phase };
    }
    const currentOrNext = () => DAYS.find(d => dayDate(d).getTime() >= today0());
    function nowInfo() {
      const d = currentOrNext();
      if (!d) return { live: false, label: "과정 종료", title: "모든 과정을 마쳤어요 🎓", day: DAYS[7] };
      if (!isToday(d)) return { live: false, label: `다음 수업 · ${fmtDay(d)} ${hours(d).split("–")[0]}`, title: `DAY ${d.no} · ${d.title}`, day: d };
      const n = new Date(), mins = n.getHours() * 60 + n.getMinutes(), end = d.half ? 780 : 1070;
      if (mins < 540) return { live: false, label: "오늘 09:00 시작", title: `DAY ${d.no} · ${d.title}`, day: d };
      if (mins < end) return { live: true, label: `지금 수업 중 · ${hours(d)}`, title: `DAY ${d.no} · ${d.title}`, day: d };
      return { live: false, label: "오늘 수업 종료 · 노트를 정리해 보세요", title: `DAY ${d.no} · ${d.title}`, day: d };
    }
    const filesOf = (day, kind) => files.filter(f => f.day === day && f.kind === kind).sort((a, b) => a.createdAt - b.createdAt);
    const firstShot = day => files.find(f => f.day === day && f.kind === "deliverable" && f.type.startsWith("image/"));
    function fileType(rec) {
      const ext = (rec.name.split(".").pop() || "").toLowerCase();
      if (rec.type.startsWith("image/")) return "image";
      if (rec.type === "application/pdf" || ext === "pdf") return "pdf";
      if (["txt", "md", "doc", "docx", "ppt", "pptx", "xls", "xlsx", "hwp", "hwpx", "csv", "json", "html", "css", "js", "ts", "py", "key", "pages"].includes(ext)) return "doc";
      return "other";
    }
    const isTextual = rec => rec.type.startsWith("text/") || /\.(txt|md|csv|json|html?|css|js|ts|py|java|c|cpp|sql|ya?ml|xml)$/i.test(rec.name);
    const hasRecord = no => { const s = state.days[no]; return !!(s.note.trim() || s.kpt.k.trim() || s.kpt.p.trim() || s.kpt.t.trim()); };

    function recentActivity(limit = 7) {
      const items = [];
      for (const d of DAYS) {
        const s = state.days[d.no];
        if (s.noteAt && hasRecord(d.no)) items.push({ at: s.noteAt, kind: "note", title: `DAY ${d.no} 노트 · ${firstLine(s.note) || "회고 작성"}`, sub: d.title, href: `#/day/${d.no}` });
        if (s.deliv.done && s.deliv.doneAt) items.push({ at: s.deliv.doneAt, kind: "star", title: `결과물 완성 · ${d.deliv}`, sub: `DAY ${d.no} · ${d.title}`, href: `#/day/${d.no}` });
      }
      for (const f of files) if (f.kind === "material" || f.kind === "deliverable") items.push({ at: f.createdAt, kind: "file", title: f.name, sub: `${dayLabel(f.day)} · ${f.kind === "deliverable" ? "결과물 이미지" : "강의 자료"} · ${fmtSize(f.size)}`, file: f });

    async function addFiles(list, day, kind) {
      const added = [], skipped = [];
      for (const f of list) {
        if (f.size > MAX_FILE) { skipped.push(`${f.name} (100MB 초과)`); continue; }
        const rec = { id: uid("f"), day, kind, name: f.name || "이름없음", type: f.type || "application/octet-stream", size: f.size, createdAt: Date.now(), blob: f };
        try {
          await storeFile(rec);
          files.push(rec);
          added.push(rec);
        } catch (e) {
          skipped.push(`${f.name} (${e?.name === "QuotaExceededError" ? "저장 공간 부족" : "저장 실패"})`);
        }
      }
      if (added.length) touch();
      if (skipped.length) toast(`저장하지 못한 파일: ${skipped.join(", ")}`, null, null, 7000);
      else if (added.length) toast(`${added.length}개 파일을 보관했어요`);
      if (storageMode === "memory" && added.length && Sync.status !== "ok") toast("이 브라우저에서는 파일이 임시로만 보관돼요. 저장 폴더를 연결하거나 백업을 내보내세요.", null, null, 7000);
      return added;
    }

    // 글자를 그 자리에서 바로 고치기 (Enter 저장 · Esc 취소 · 다른 곳 누르면 저장)
    function inlineEdit(target, { value, onSave, validate, type = "text", attrs = {} }) {
      const input = el("input", { class: "input inline-input", type, ...attrs });
      input.value = value;
      target.replaceWith(input);
      input.focus();
      input.select?.();
      let done = false;
      const restore = () => { done = true; if (input.isConnected) input.replaceWith(target); };
      const finish = how => {
        if (done) return;
        const v = input.value.trim();
        if (!how || v === String(value)) return restore();
        const err = validate?.(v);
        if (err) {
          toast(err);
          if (how === "enter") { input.focus(); return; }
          return restore();
        }
        done = true;
        Promise.resolve(onSave(v)).finally(() => { if (input.isConnected) input.replaceWith(target); });
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); finish("enter"); }
        else if (e.key === "Escape") { e.preventDefault(); finish(null); }
      });
      input.addEventListener("blur", () => finish("blur"));
      input.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); });
    }

    const PROJ_SHOW = [["all", "전체"], ["project", "대표 결과물"], ["practice", "실습 결과물"], ["shipped", "배포 완료"], ["wip", "진행 중"], ["featured", "포트폴리오"]];

    const projectsOf = day => state.projects.filter(p => p.day === day);

    function viewProjects() {

        if (projFilter.show === "practice") list = list.filter(isPractice);

    function projectCard(p, redraw) {
      const shot = projShot(p), url = safeUrl(p.url), repo = safeUrl(p.repo);
      const skills = p.stack.split(",").map(s => s.trim()).filter(Boolean);
      const star = el("button", {
        class: `icon-btn star${p.featured ? " on" : ""}`, title: p.featured ? "포트폴리오에서 빼기" : "포트폴리오에 넣기",
        "aria-label": p.featured ? "포트폴리오에서 빼기" : "포트폴리오에 넣기", "aria-pressed": String(p.featured),
        onclick: () => {
          p.featured = !p.featured; touch(); redraw();
          toast(p.featured ? (isShipped(p) ? "포트폴리오에 넣었어요" : "배포까지 마치면 포트폴리오에 표시돼요") : "포트폴리오에서 뺐어요");
        },
      }, icon("star", "sm"));

    async function buildPortfolio() {
      const p = state.profile;
      const img = async rec => (rec && rec.type.startsWith("image/") ? esc(await blobToDataURL(rec.blob)) : "");
      const photo = await img(files.find(f => f.kind === "profile"));
      const qr = await img(files.find(f => f.kind === "qr"));
      const agent = safeUrl(state.final.agent.link), repo = safeUrl(state.final.readme.link), gh = safeUrl(p.github);
      const contactUrl = safeUrl(p.contact) || (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.contact.trim()) ? `mailto:${p.contact.trim()}` : "");
      const para = s => esc(s.trim()).replace(/\n/g, "<br>");
      const skills = p.skills.split(",").map(s => s.trim()).filter(Boolean);
      const timeline = [];
      for (const d of DAYS) {
        const dv = state.days[d.no].deliv;
        const shot = firstShot(d.no);
        if (!dv.include || !(dv.done || dv.desc.trim() || dv.link.trim() || shot)) continue;
        const link = safeUrl(dv.link);
        timeline.push(`<article class="item">
          <div class="when"><b>DAY ${d.no}</b><span>${esc(fmtDay(d))}</span></div>
          <div class="card">
            ${shot ? `<img src="${await img(shot)}" alt="${esc(d.deliv)} 스크린샷">` : ""}
            <div class="pad">
              <p class="topic">${esc(d.title)}</p>
              <h3>${esc(d.deliv)}${dv.done ? ' <span class="ok">완성</span>' : ""}</h3>
              ${dv.desc.trim() ? `<p>${para(dv.desc)}</p>` : ""}
              ${link ? `<a class="more" href="${esc(link)}" target="_blank" rel="noopener noreferrer">결과물 보기 →</a>` : ""}
            </div>
          </div>
        </article>`);
      }
      // 배포한 결과물: 커밋 · 푸시 · 배포를 모두 마치고 '포트폴리오에 표시'를 켠 것만 (비공개 저장소 링크는 넣지 않음)
      const shippedAll = state.projects.filter(x => x.featured && isShipped(x) && safeUrl(x.url)).sort((a, b) => a.day - b.day || a.createdAt - b.createdAt);
      const shipped = shippedAll.filter(x => !isPractice(x));
      // HTML 실습 결과물: DAY별 목록 (그림 없이 제목 · 한 줄 설명 · 기술 · 링크)
      const practiceByDay = new Map();
      for (const x of shippedAll.filter(isPractice)) { if (!practiceByDay.has(x.day)) practiceByDay.set(x.day, []); practiceByDay.get(x.day).push(x); }
      const practiceHtml = [...practiceByDay].map(([day, xs]) => `<div class="pr-day"><b>${day ? `DAY ${day}` : "공통"}</b><ul>${xs.map(x => {
        const st = x.stack.split(",").map(s => s.trim()).filter(Boolean).slice(0, 4);
        return `<li><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>${x.desc ? `<span>${esc(x.desc)}</span>` : ""}${st.length ? `<i>${st.map(esc).join(" · ")}</i>` : ""}</li>`;
      }).join("")}</ul></div>`).join("");
      const practiceN = shippedAll.length - shipped.length;
      const projCards = [];
      for (const x of shipped) {
        const sh = projShot(x), u = safeUrl(x.url), r = x.priv ? "" : safeUrl(x.repo);
        const st = x.stack.split(",").map(s => s.trim()).filter(Boolean);
        projCards.push(`<article class="pj">
          ${sh ? `<img src="${await img(sh)}" alt="${esc(x.title)} 화면" loading="lazy">` : ""}
          <div class="pad">
            <p class="topic">${x.day ? `DAY ${x.day}` : "공통"} · 배포 완료${x.commits ? ` · 커밋 ${x.commits}회` : ""}</p>
            <h3>${esc(x.title)}</h3>

        const hits = [];

    async function exportBackup() {
      toast("백업 파일을 만드는 중…", null, null, 60000);
      try {
        await flushSave();
        const payload = { state: { ...state, lastBackup: Date.now() }, files: [] };
        for (const f of files) {
          payload.files.push({ id: f.id, day: f.day, kind: f.kind, name: f.name, type: f.type, size: f.size, createdAt: f.createdAt, data: await blobToDataURL(f.blob) });
        }
        // 백업 파일도 PIN으로 암호화 (파일을 잃어버려도 내용이 노출되지 않음)
        const out = { app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), enc: Vault.publicInfo(), payload: await Vault.seal(payload) };
        download(new Blob([JSON.stringify(out)], { type: "application/json" }), `bootcamp-backup-${stamp()}.json`);
        state.lastBackup = Date.now();
        dirty = true;
        await flushSave();
        toast(`백업 완료 · 파일 ${files.length}개 포함`);
        if (location.hash === "#/backup") route();
      } catch (e) {
        toast(`백업 실패: ${e?.message || "알 수 없는 오류"}`, null, null, 7000);
      }
    }
    async function importBackup(file) {
      let data;
      try { data = JSON.parse(await file.text()); } catch { toast("JSON 파일을 읽을 수 없어요", null, null, 6000); return; }
      if (isLegacy(data)) {
        if (!confirm("이전 '플래너' 버전 파일이에요.\n체크리스트 · 메모 · 결과물 링크를 현재 기록에 합칠까요?")) return;
        const old = normalize(fromLegacy(data));
        Object.assign(state.done, old.done);
        Object.assign(state.removed, old.removed);
        for (const d of DAYS) {
          const mine = state.custom[d.no] || [], ids = new Set(mine.map(t => t.id));
          const extra = (old.custom[d.no] || []).filter(t => !ids.has(t.id));
          if (mine.length || extra.length) state.custom[d.no] = [...mine, ...extra];
          const cur = state.days[d.no], o = old.days[d.no];
          if (!cur.note.trim() && o.note) { cur.note = o.note; cur.noteAt = Date.now(); }
          if (!cur.deliv.link) cur.deliv.link = o.deliv.link;
          if (!cur.deliv.done && o.deliv.done) { cur.deliv.done = true; cur.deliv.doneAt = Date.now(); }
        }
        for (const f of FINAL) {
          const cur = state.final[f.key], o = old.final[f.key];
          cur.done = cur.done || o.done;
          if (!cur.link) cur.link = o.link;
        }
        touch(); await flushSave(); route();
        toast("이전 플래너 데이터를 합쳤어요");
        return;
      }
      if (!data || data.app !== APP_ID || !(data.state || isSealed(data.payload))) { toast("이 앱의 백업 파일이 아니에요", null, null, 6000); return; }
      if (isSealed(data.payload)) {
        const key = await keyForArchive(data.enc, "이 백업 파일");
        if (!key) { toast("백업을 불러오지 않았어요"); return; }
        try { const p = await Vault.open(data.payload, key); data = { ...data, state: p.state, files: p.files }; }
        catch { toast("백업 파일을 열 수 없어요 (손상되었거나 PIN이 달라요)", null, null, 7000); return; }
      }
      const incoming = Array.isArray(data.files) ? data.files : [];
      if (!confirm(`백업 파일 (${data.exportedAt ? new Date(data.exportedAt).toLocaleString("ko-KR") : "날짜 미상"})\n파일 ${incoming.length}개 포함\n\n현재 기록을 이 백업으로 바꿀까요?`)) return;
      toast("백업을 복원하는 중…", null, null, 60000);
      let recs;
      try {

    /* =========================================================
       15-1. API 키 보관 (state · 백업 · 저장 폴더에 절대 포함되지 않음)
       ========================================================= */
    const SECRET_SS = "jnu-ai-bootcamp-archive-secrets";
    const Secrets = {
      data: { anthropic: "", openai: "" },
      where: { anthropic: "", openai: "" }, // "device" | "session" | ""
      // 저장소에서 읽기 (암호화본은 복호화, 이전 버전의 평문은 그대로 읽은 뒤 암호화로 전환)
      async read(kind) {
        try {
          // USB 모드: API 키도 암호화해 USB에 보관 (PC 브라우저에는 남기지 않음)
          if (kind === "device" && Vault.portable) {
            try { const v = await (await storeFetch(storeUrl("secrets.json"))).json(); return { v: isSealed(v) ? obj(await Vault.open(v)) : {}, plain: false }; }
            catch { return { v: {}, plain: false }; }
          }
          const v = kind === "device" ? await DB.get("kv", "secrets") : JSON.parse(sessionStorage.getItem(SECRET_SS) || "null");
          if (!v) return { v: {}, plain: false };
          return isSealed(v) ? { v: obj(await Vault.open(v)), plain: false } : { v: obj(v), plain: true };
        } catch { return { v: {}, plain: false }; }
      },
      async write(kind, v) {
        const sealed = await Vault.seal(v);
        if (kind === "device" && Vault.portable) await storeFetch(storeUrl("secrets.json"), { method: "PUT", body: JSON.stringify(sealed) });
        else if (kind === "device") await DB.put("kv", sealed, "secrets");
        else sessionStorage.setItem(SECRET_SS, JSON.stringify(sealed));
      },
      async load() {
        for (const kind of ["device", "session"]) {
          const { v, plain } = await this.read(kind);
          for (const p of Object.keys(this.data)) if (str(v[p])) { this.data[p] = v[p]; this.where[p] = kind; }
          if (plain) { try { await this.write(kind, v); } catch {} }
        }
      },
      get(p) { return this.data[p] || ""; },
      async set(p, key, remember) {
        await this.clear(p);
        this.data[p] = key;
        const kind = remember ? "device" : "session";
        this.where[p] = kind;
        const { v } = await this.read(kind);
        v[p] = key;
        await this.write(kind, v);
      },
      async clear(p) {
        this.data[p] = "";
        this.where[p] = "";
        for (const kind of ["device", "session"]) {
          try { const { v } = await this.read(kind); if (p in v) { delete v[p]; await this.write(kind, v); } } catch {}
        }
      },
      mask(p) { const k = this.get(p); return k ? `${k.slice(0, 7)}…${k.slice(-4)}` : ""; },
    };

    /* =========================================================
       15-2. AI 클라이언트 (Claude · ChatGPT, 스트리밍)
             로컬 서버(.env)가 있으면 서버를 거치고, 없으면 브라우저에 저장한 키로 직접 호출
       ========================================================= */
    const AI = {
      server: null,
      async detect() {
        if (!/^https?:$/.test(location.protocol)) return;
        try {
          const r = await fetch("/api/health", { cache: "no-store" });
          if (!r.ok) return;
          const j = await r.json();
          if (j && j.app === APP_ID) this.server = j;
        } catch {}
      },
      via(p) { return this.server?.providers?.[p]?.configured ? "server" : Secrets.get(p) ? "browser" : null; },
      model(p) { return state.ai.models[p] || this.server?.providers?.[p]?.model || PROVIDERS[p].models[0][0]; },
      anyReady() { return !!(this.via("anthropic") || this.via("openai")); },

      async run(o) {
        const p = o.provider, via = this.via(p);
        if (!via) throw new Error(`${PROVIDERS[p].label} API 키가 설정되지 않았어요. [AI · 연동 설정]에서 키를 입력하세요.`);
        const req = p === "anthropic" ? claudeRequest(o) : openaiRequest(o);
        let res;
        try {
          res = await fetch(via === "server" ? `/api/ai/${p}` : req.url, {
            method: "POST", headers: via === "server" ? req.serverHeaders : req.headers, body: JSON.stringify(req.body), signal: o.signal,
          });
        } catch (e) {
          if (e.name === "AbortError") throw e;
          throw new Error("AI 서버에 연결하지 못했어요. 인터넷 연결을 확인하세요.");
        }
        if (!res.ok) throw new Error(await apiError(res, p));
        let text = "", stop = "";
        await readSSE(res, data => {
          if (data === "[DONE]") return;
          let ev;
          try { ev = JSON.parse(data); } catch { return; }
          if (p === "anthropic") {
            if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") { text += ev.delta.text; o.onText?.(text); }
            else if (ev.type === "message_delta" && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
            else if (ev.type === "error") throw new Error(ev.error?.message || "AI 응답 중 오류가 발생했어요");
          } else {
            if (ev.error) throw new Error(ev.error.message || "AI 응답 중 오류가 발생했어요");
            const c = ev.choices?.[0];
            if (c?.delta?.content) { text += c.delta.content; o.onText?.(text); }
            if (c?.finish_reason) stop = c.finish_reason;
          }
        });
        return { text, stop };
      },

      async listModels(p) {
        const via = this.via(p);
        if (!via) throw new Error("API 키가 필요해요");
        const P = PROVIDERS[p];
        const url = via === "server" ? `/api/models/${p}` : p === "anthropic" ? `${P.base}/v1/models?limit=100` : `${P.base}/v1/models`;
        const headers = via === "server" ? {}
          : p === "anthropic" ? { "x-api-key": Secrets.get(p), "anthropic-version": P.version, "anthropic-dangerous-direct-browser-access": "true" }
          : { authorization: `Bearer ${Secrets.get(p)}` };
        let res;
        try { res = await fetch(url, { headers, cache: "no-store" }); }
        catch { throw new Error("AI 서버에 연결하지 못했어요. 인터넷 연결을 확인하세요."); }
        if (!res.ok) throw new Error(await apiError(res, p));
        const j = await res.json();
        let ids = (Array.isArray(j.data) ? j.data : []).map(m => m.id).filter(id => typeof id === "string");
        if (p === "anthropic") ids = ids.filter(id => id.startsWith("claude-"));
        if (p === "openai") ids = ids.filter(id => /^(gpt|o\d|chatgpt)/.test(id) && !/(audio|realtime|transcribe|tts|image|embed|search|moderation|instruct)/.test(id));
        return ids.sort();
      },
    };

    function claudeRequest(o) {
      const content = [];
      if (o.image) content.push({ type: "image", source: { type: "base64", media_type: o.image.type, data: o.image.data } });
      content.push({ type: "text", text: o.text });
      const body = { model: o.model, max_tokens: o.maxTokens || 64000, stream: true, system: o.system, messages: [{ role: "user", content }] };
      // Claude 5 계열: 생각 깊이(effort)를 직접 지정
      if (/^claude-(opus|sonnet|haiku|fable)-5/.test(o.model)) body.output_config = { effort: o.effort || "medium" };
      const base = { "content-type": "application/json" };
      // 안전 정책으로 거절되면 서버가 대체 모델로 이어서 답하도록 (Opus 5.5 · Sonnet 5.5)
      if (/^claude-(opus|sonnet)-5-5/.test(o.model)) { body.fallbacks = "default"; base["anthropic-beta"] = "server-side-fallback-2026-07-01"; }
      return {
        url: `${PROVIDERS.anthropic.base}/v1/messages`, body, serverHeaders: base,
        headers: { ...base, "x-api-key": Secrets.get("anthropic"), "anthropic-version": PROVIDERS.anthropic.version, "anthropic-dangerous-direct-browser-access": "true" },
      };
    }
    function openaiRequest(o) {
      const content = [{ type: "text", text: o.text }];
      if (o.image) content.push({ type: "image_url", image_url: { url: `data:${o.image.type};base64,${o.image.data}` } });
      const body = { model: o.model, stream: true, max_completion_tokens: 16000, messages: [{ role: "system", content: o.system }, { role: "user", content }] };
      const base = { "content-type": "application/json" };
      return { url: `${PROVIDERS.openai.base}/v1/chat/completions`, body, serverHeaders: base, headers: { ...base, authorization: `Bearer ${Secrets.get("openai")}` } };
    }
    async function apiError(res, p) {
      let msg = "";
      try { const j = await res.json(); msg = str(j?.error?.message) || str(j?.message); } catch {}
      const name = PROVIDERS[p].label;
      const map = {
        400: "요청을 처리할 수 없어요",
        401: `${name} API 키가 올바르지 않아요. 키를 다시 확인하세요`,
        403: "이 키로는 해당 모델 · 기능을 쓸 수 없어요",
        404: "모델을 찾을 수 없어요. [AI · 연동 설정]에서 모델을 다시 고르세요",
        413: "입력이 너무 커요. 이미지나 글을 줄여 보세요",
        429: "요청이 너무 많거나 크레딧이 부족해요. 잠시 후 다시 시도하거나 결제 상태를 확인하세요",
        529: "AI 서버가 혼잡해요. 잠시 후 다시 시도하세요",
      };
      const base = map[res.status] || (res.status >= 500 ? "AI 서버에 일시적인 문제가 있어요" : `오류가 발생했어요 (${res.status})`);
      return msg ? `${base} — ${msg}` : base;
    }
    // Server-Sent Events 읽기 (조각난 줄 · \r\n 모두 처리)
    async function readSSE(res, onData) {
      if (!res.body) return;
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      const handle = block => {
        const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).replace(/^ /, "")).join("\n");
        if (data) onData(data);
      };
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, "\n").replace(/\r(?!$)/g, "\n");
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 2); }
        }
        buf = (buf + dec.decode()).replace(/\r\n?/g, "\n");
        if (buf.trim()) handle(buf);
      } finally {
        try { reader.releaseLock(); } catch {}
      }
    }
    // 이미지를 AI에 보내기 좋은 크기(긴 변 1568px)로 줄여 base64로
    async function prepImage(blob) {
      const ok = /^image\/(png|jpeg|gif|webp)$/.test(blob.type);
      const bmp = await createImageBitmap(blob);
      const scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      if (ok && scale === 1 && blob.size < 3.5 * 1024 * 1024) {
        bmp.close?.();
        const url = await blobToDataURL(blob);
        return { type: blob.type, data: url.slice(url.indexOf(",") + 1) };
      }
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(bmp.width * scale));
      c.height = Math.max(1, Math.round(bmp.height * scale));
      const g = c.getContext("2d");
      g.fillStyle = "#fff";
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(bmp, 0, 0, c.width, c.height);
      bmp.close?.();
      const url = c.toDataURL("image/jpeg", 0.88);
      return { type: "image/jpeg", data: url.slice(url.indexOf(",") + 1) };
    }
    async function copyText(t) {

    const REA_FILE_MAX = 50 * 1024 * 1024;
    let reaStatusCache = null;

    async function reaStatus(refresh = false) {
      if (!refresh && reaStatusCache) return reaStatusCache;
      if (!/^https?:$/.test(location.protocol)) return (reaStatusCache = { available: false, mode: "offline", tools: [] });
      try {
        const r = await fetch("/api/rea/status", { cache: "no-store" });
        if (!r.ok) throw new Error("status");
        return (reaStatusCache = await r.json());
      } catch { return (reaStatusCache = { available: false, mode: "offline", tools: [] }); }
    }

    async function hashHex(buffer) {
      const digest = await crypto.subtle.digest("SHA-256", buffer);
      return [...new Uint8Array(digest)].map(x => x.toString(16).padStart(2, "0")).join("");
    }

    function reaFormat(bytes, name) {
      const h = [...bytes.slice(0, 8)].map(x => x.toString(16).padStart(2, "0")).join("");
      if (h.startsWith("4d5a")) return "PE · Windows 실행 파일";
      if (h.startsWith("7f454c46")) return "ELF · Linux 실행 파일";
      if (["feedface", "feedfacf", "cefaedfe", "cffaedfe", "cafebabe"].some(x => h.startsWith(x))) return "Mach-O · macOS/iOS 실행 파일";
      if (h.startsWith("504b0304")) return /\.apk$/i.test(name) ? "APK · Android 패키지" : "ZIP 계열 압축 파일";
      if (/\.har$/i.test(name)) return "HAR · 네트워크 캡처";
      if (/\.json$/i.test(name)) return "JSON 데이터";
      if (/\.(js|mjs|cjs)$/i.test(name)) return "JavaScript 소스";
      if (/\.(html?|css|md|txt)$/i.test(name)) return "텍스트 문서";
      return "알 수 없는 형식";
    }

    function reaEntropy(bytes) {
      const counts = new Uint32Array(256);
      const max = Math.min(bytes.length, 1024 * 1024);
      const step = Math.max(1, Math.floor(bytes.length / Math.max(1, max)));
      let n = 0;
      for (let i = 0; i < bytes.length && n < max; i += step, n++) counts[bytes[i]]++;
      if (!n) return 0;
      let h = 0;
      for (const c of counts) if (c) { const p = c / n; h -= p * Math.log2(p); }
      return Math.round(h * 1000) / 1000;
    }

    function reaStrings(bytes, min = 5, limit = 200) {
      const out = [];
      let start = -1;
      const max = Math.min(bytes.length, 12 * 1024 * 1024);
      const push = end => {
        if (start < 0 || end - start < min || out.length >= limit) return;
        let value = "";
        for (let i = start; i < end && value.length < 500; i++) value += String.fromCharCode(bytes[i]);
        out.push({ offset: `0x${start.toString(16)}`, value });
      };
      for (let i = 0; i <= max && out.length < limit; i++) {
        const printable = i < max && bytes[i] >= 0x20 && bytes[i] <= 0x7e;
        if (printable && start < 0) start = i;
        else if (!printable && start >= 0) { push(i); start = -1; }
      }
      return out;
    }

    function reaHex(bytes, length = 256) {
      const rows = [];
      for (let off = 0; off < Math.min(bytes.length, length); off += 16) {
        const row = bytes.slice(off, Math.min(bytes.length, off + 16));
        const hex = [...row].map(x => x.toString(16).padStart(2, "0")).join(" ");
        const ascii = [...row].map(x => x >= 32 && x <= 126 ? String.fromCharCode(x) : ".").join("");
        rows.push(`${off.toString(16).padStart(8, "0")}  ${hex.padEnd(47)}  ${ascii}`);
      }
      return rows.join("\n");
    }

    function reaMarkdown(r) {
      const strings = r.strings.slice(0, 50).map(s => `- \`${s.offset}\` ${s.value.replace(/[\r\n]+/g, " ")}`).join("\n") || "- 발견하지 못함";
      const urls = r.urls.map(u => `- ${u}`).join("\n") || "- 발견하지 못함";
      const hints = r.hints.map(h => `- ${h}`).join("\n") || "- 특이 신호 없음";
      return `# REA 읽기 전용 분석 보고서\n\n## 대상\n- 파일: ${r.name}\n- 크기: ${fmtSize(r.size)}\n- SHA-256: \`${r.sha256}\`\n- 형식: ${r.format}\n- 표본 엔트로피: ${r.entropy}\n\n## 확인된 URL\n${urls}\n\n## 문자열 표본\n${strings}\n\n## 해석 단서\n${hints}\n\n## 한계\n- 파일을 실행하지 않은 정적 분석 결과입니다.\n- 문자열은 앞부분 최대 12MB에서 200개까지 확인합니다.\n- 엔트로피는 최대 1MB 표본이므로 악성 여부를 단정할 근거가 아닙니다.\n`;
    }

    async function reaOffline(file) {
      if (!file || file.size > REA_FILE_MAX) throw new Error("50MB 이하 파일만 분석할 수 있어요");
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const strings = reaStrings(bytes);
      const urls = [...new Set(strings.flatMap(s => s.value.match(/https?:\/\/[^\s"'<>]{4,300}/gi) || []))].slice(0, 30);
      const entropy = reaEntropy(bytes);
      const format = reaFormat(bytes, file.name);
      const hints = [];
      if (/실행 파일/.test(format)) hints.push("실행 파일 형식입니다. 이 분석실은 파일을 실행하지 않습니다.");
      if (entropy >= 7.2) hints.push("엔트로피가 높습니다. 압축·암호화·패킹 여부는 추가 확인이 필요합니다.");
      if (urls.length) hints.push(`URL ${urls.length}개가 문자열에서 확인됐습니다. 존재만으로 실제 접속을 의미하지 않습니다.`);
      if (!strings.length) hints.push("읽을 수 있는 ASCII 문자열이 거의 없습니다. 바이너리·압축 데이터일 수 있습니다.");
      const result = { name: file.name, size: file.size, sha256: await hashHex(buffer), format, entropy, strings, urls, hints, hex: reaHex(bytes) };
      result.report = reaMarkdown(result);
      return result;
    }

      const item = { id: uid("r"), at: Date.now(), name: result.name || "분석 파일", size: result.size || 0,
        sha256: result.sha256 || "", format: result.format || "", source, tool, report: report.slice(0, 120000) };

    }

    function defaultTimerDay() {

    const Timer = {
      elapsed() { const t = state.timer; return t.acc + (t.running ? Math.max(0, Date.now() - t.startedAt) : 0); },
      start() {
        const t = state.timer;
        if (t.running) return;
        if (!t.acc) { t.firstAt = Date.now(); t.notified = false; }
        if (!t.day) t.day = defaultTimerDay();
        t.running = true;
        t.startedAt = Date.now();
        touch(); renderTimer();
      },
      startFor(day) {
        const t = state.timer;
        if (this.elapsed() && t.day !== day) {
          if (!confirm(`진행 중인 DAY ${t.day} 타이머를 기록하고 DAY ${day} 타이머를 새로 시작할까요?`)) return;
          this.stop(true);
        }
        t.day = day;
        this.start();
        toast(`DAY ${day} 실습 타이머를 시작했어요`);
      },
      pause() {
        const t = state.timer;
        if (!t.running) return;
        t.acc += Math.max(0, Date.now() - t.startedAt);
        t.running = false;
        t.startedAt = 0;
        touch(); renderTimer();
      },
      stop(silent) {
        const t = state.timer, ms = this.elapsed();
        if (!ms) return;
        const day = t.day || defaultTimerDay();
        if (ms < 60000) {
          if (!silent && !confirm("1분 미만은 기록되지 않아요. 타이머를 초기화할까요?")) return;
        } else {
          const end = Date.now();
          state.sessions.push({ id: uid("t"), day, start: t.firstAt || end - ms, end, sec: Math.round(ms / 1000), memo: "" });
          if (!silent) toast(`DAY ${day} 실습 ${fmtDur(ms / 1000)}을 기록했어요`, () => { location.hash = `#/day/${day}`; }, "기록 보기", 6000);
        }
        Object.assign(t, { running: false, startedAt: 0, acc: 0, firstAt: 0, notified: false });

    };
    function renderTimer() {

        el("button", { class: `tbtn${t.running ? "" : " go"}`, title: t.running ? "일시정지" : "시작", "aria-label": t.running ? "타이머 일시정지" : "타이머 시작",
          onclick: () => (t.running ? Timer.pause() : Timer.start()) }, icon(t.running ? "pause" : "play", "sm")),
        el("button", { class: "tbtn", title: "끝내고 실습 기록 저장", "aria-label": "타이머 끝내고 기록 저장", disabled: !ms && !t.running, onclick: () => Timer.stop() }, icon("save", "sm"))));

        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.6);
        o.connect(g).connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.65);

    const Lock = {
      pin: "",

      init() {

      tick() {

          Vault.raw = null;
          this.busy = false;
          this.msg(e?.message || "기록을 열지 못했어요", true);
          this.tick();
        }
      },
    };

      document.querySelector(".app").hidden = false;

      renderSyncUI();
      renderTimer();

      route();
      if (needsSave) { dirty = true; await flushSave(); } else { lastSavedAt = Date.now(); setSaveState("saved"); }
      if (needsSave) { try { localStorage.removeItem(LEGACY_KEY); } catch {} }
      if (migrated) toast("이전 플래너의 체크리스트와 메모를 가져왔어요");
      else if (converted) toast("기존 기록을 암호화된 형식으로 전환했어요");
      markActive();
      navigator.storage?.persist?.().catch(() => {});
      if (Vault.portable && Vault.remoteInfo) UsbLoading.show();
      try { await Sync.init(); } finally { UsbLoading.hide(); }
      $("#ejectBtn").hidden = !Vault.portable;
      setInterval(() => { refreshChrome(); renderSyncUI(); }, 60000);
      setInterval(() => { if (dirty) flushSave(); }, 30000); // 주기적 자동 저장
    }
    async function init() {
      Theme.apply();
      $("#lockIc").replaceWith(icon("lock", "sm"));
      $("#themeBtn").addEventListener("click", () => Theme.cycle());
      $("#lockBtn").addEventListener("click", lockNow);
      tickClock();
      setInterval(tickClock, 1000);
      if (!window.isSecureContext || !window.crypto?.subtle) {
        Lock.msg("이 환경에서는 암호화를 쓸 수 없어요. Chrome · Edge 최신 버전으로 index.html을 열거나 start.bat으로 실행하세요.", true);
        return;
      }
      try { await DB.open(); } catch (e) { console.warn("IndexedDB 사용 불가:", e); DB.db = null; storageMode = "memory"; }
      $("#ejectBtn").addEventListener("click", ejectUsb);
      // USB · PC 폴더에 저장된 기록의 키 정보를 미리 읽어 둠 (PIN 확인 · 다른 PC에서 열기에 사용, 내용은 암호화되어 있음)
      await AI.detect();
      if (AI.server?.store) {
        Vault.portable = !!AI.server.portable;
        try {
          const a = await (await storeFetch(storeUrl("archive.json"))).json();
          if (a && a.app === APP_ID && a.enc && isSealed(a.payload)) { Vault.remoteInfo = a.enc; Vault.remoteAt = num(a.at); }
        } catch {}
        if (Vault.portable) $("#lockFoot").textContent = "USB 휴대 모드 · 기록은 USB에 암호화되어 있고, 이 PC에는 남기지 않아요";
      }
      Lock.init();
    }
    init();
  </script>
</body>
</html>
